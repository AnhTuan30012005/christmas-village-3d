<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Christmas Village 3D — Interactive Winter Wonderland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    /* Full-bleed 100vw x 100vh 3D Viewport */
    #city-canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #city-canvas-container:active {
      cursor: grabbing;
    }

    /* Glassmorphism Floating UI Layer */
    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.55s ease;
    }
    .ui-layer.ui-idle {
      opacity: 0.42;
    }
    .ui-layer:hover {
      opacity: 1 !important;
    }

    .glass-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(8, 13, 24, 0.70);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Top-Left Minimal Emblem */
    .brand-float {
      position: fixed;
      top: 18px;
      left: 20px;
      padding: 8px 16px;
      gap: 9px;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
    }
    .brand-name {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(248, 250, 252, 0.92);
    }

    /* Top-Right Floating Utilities */
    .top-actions {
      position: fixed;
      top: 18px;
      right: 20px;
      gap: 6px;
    }

    /* Bottom Floating Glass Dock */
    .bottom-dock {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 10px;
      gap: 4px;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
    }

    .g-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(226, 232, 240, 0.85);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .g-btn:hover {
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
    }
    .g-btn.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.45);
      color: #fde68a;
    }
    .g-btn.walk-btn {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.82), rgba(217, 119, 6, 0.82));
      border-color: rgba(253, 224, 71, 0.4);
      color: #fffbeb;
      font-weight: 600;
    }
    .g-btn.walk-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }
    .g-btn.god-btn {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(16, 185, 129, 0.22));
      border-color: rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      font-weight: 600;
    }
    .g-btn.god-btn.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.85), rgba(16, 185, 129, 0.85));
      border-color: rgba(186, 230, 253, 0.75);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    /* God-Mode / Free-Roam Live HUD Pill (Top-Center) */
    .god-hud {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      font-size: 0.76rem;
      color: #e0f2fe;
      border-color: rgba(56, 189, 248, 0.42);
      max-width: calc(100vw - 380px);
    }
    .god-hud.visible {
      display: inline-flex;
    }
    .god-zone {
      font-weight: 600;
      color: #fde68a;
      white-space: nowrap;
    }
    .god-alt {
      color: #7dd3fc;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .god-keys {
      color: rgba(226, 232, 240, 0.78);
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .g-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* Audio Equalizer Bars */
    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .eq span {
      width: 2px;
      height: 3px;
      background: #fbbf24;
      border-radius: 2px;
      transition: height 0.2s;
    }
    .audio-playing .eq span {
      animation: eqBounce 0.75s ease-in-out infinite alternate;
    }
    .audio-playing .eq span:nth-child(2) { animation-delay: 0.18s; }
    .audio-playing .eq span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes eqBounce {
      0%   { height: 3px; }
      100% { height: 12px; }
    }

    /* Subtle Hint Toast */
    .hint-badge {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: rgba(203, 213, 225, 0.65);
      letter-spacing: 0.02em;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    /* Glass Modal for Editing Welcome Archway Sign */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 4, 10, 0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: min(400px, calc(100vw - 32px));
      padding: 22px;
      border-radius: 18px;
      background: rgba(12, 18, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    .modal-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fde68a;
    }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(2, 6, 16, 0.75);
      color: #ffffff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .modal-input:focus {
      border-color: #fbbf24;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Full-Screen 3D Canvas -->
  <div id="city-canvas-container"></div>

  <!-- Minimal Floating Glassmorphism UI -->
  <div class="ui-layer" id="ui-layer">
    <!-- Top-Left Brand Emblem -->
    <div class="glass-pill brand-float">
      <span class="brand-dot"></span>
      <span class="brand-name">Christmas Village 3D</span>
    </div>

    <!-- Top-Center God-Mode / Free-Roam Live Compass HUD -->
    <div class="glass-pill god-hud" id="god-hud">
      <span class="god-zone" id="god-zone">🎄 Quảng Trường Cây Thông</span>
      <span class="god-alt" id="god-alt">Cao: 36.0m</span>
      <div class="g-divider"></div>
      <span class="god-keys">WASD bay · Space/Q lên xuống · Shift nhanh</span>
    </div>

    <!-- Top-Right Action Pill -->
    <div class="glass-pill top-actions">
      <button class="g-btn" id="btn-audio" title="Bật/Tắt nhạc Giáng sinh">
        <span id="audio-label">▶ Nhạc</span>
        <span class="eq"><span></span><span></span><span></span></span>
      </button>
      <div class="g-divider"></div>
      <button class="g-btn" id="btn-open-wish" title="Đổi dòng chữ trên cổng chào 3D">💌 Sửa Cổng Chào</button>
      <div class="g-divider"></div>
      <a href="city.html" class="g-btn" title="Xem bản nghệ thuật Hạt sáng (Point Cloud)">✨ Bản Hạt</a>
      <a href="ascii.html" class="g-btn" title="Xem bản Terminal ASCII">⚡ ASCII</a>
    </div>

    <!-- Subtle Navigation Hint -->
    <div class="hint-badge" id="nav-hint">Kéo chuột xoay 360° · Nhấp đúp vào bất kỳ ngôi nhà nào để bay sát tới · WASD di chuyển · Phím F bật Góc Nhìn Thượng Đế</div>

    <!-- Bottom Cinematic Camera & Control Dock -->
    <div class="glass-pill bottom-dock">
      <button class="g-btn god-btn" id="btn-freefly" title="Góc Nhìn Thượng Đế (Phím F): bay tự do vào mọi ngóc ngách">👁 Tự Do</button>
      <button class="g-btn cam-preset" data-preset="godview" title="Nhìn thẳng từ đỉnh trời bao quát cả 5 làng (Phím G)">🦅 Đỉnh Trời</button>
      <div class="g-divider"></div>
      <button class="g-btn active cam-preset" data-preset="overview">🏔 Toàn Cảnh</button>
      <button class="g-btn cam-preset" data-preset="archway">⛩ Cổng Chào</button>
      <button class="g-btn cam-preset" data-preset="plaza">🎄 Quảng Trường</button>
      <button class="g-btn cam-preset" data-preset="icelake">⛸ Hồ Băng</button>
      <button class="g-btn cam-preset" data-preset="fairground">🎡 Hội Chợ</button>
      <button class="g-btn cam-preset" data-preset="workshop">🚂 Xưởng Santa</button>
      <button class="g-btn cam-preset" data-preset="cathedral">⛪ Nhà Thờ</button>
      <button class="g-btn walk-btn cam-preset" data-preset="walkthrough" title="Bay mượt xuyên thung lũng qua cả 5 ngôi làng">🚶 Đi Dạo</button>

      <div class="g-divider"></div>

      <button class="g-btn" id="btn-autorotate" title="Tự xoay toàn cảnh">🔄 Xoay</button>
      <button class="g-btn active" id="btn-snow" title="Bật/Tắt tuyết rơi">❄️ <span id="snow-state">Tuyết</span></button>
      <button class="g-btn" id="btn-snapshot" title="Lưu ảnh chụp PNG">📸 Chụp</button>
    </div>
  </div>

  <!-- Edit Welcome Archway Signboard Modal -->
  <div class="modal-backdrop" id="wish-modal">
    <div class="modal-card">
      <h3 class="modal-title">💌 Tùy Chỉnh Bảng Chào Cổng Làng 3D</h3>
      <label style="font-size: 0.78rem; color: #94a3b8; display: block; margin-bottom: 8px;">Nhập lời chào hiển thị phát sáng trên cổng:</label>
      <input type="text" id="input-wish-title" class="modal-input" value="CHÚC MỪNG GIÁNG SINH" maxlength="36">
      <div class="modal-footer">
        <button class="g-btn" id="btn-close-modal">Hủy</button>
        <button class="g-btn walk-btn" id="btn-save-wish">Cập Nhật Cổng 3D</button>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="city3d.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("city-canvas-container");
      const cityApp = new ChristmasCity3D(container);
      cityApp.animate();
      window.cityApp = cityApp;

      // Subtle Auto-Dim UI after inactivity for full immersion
      const uiLayer = document.getElementById("ui-layer");
      let idleTimer = null;
      const wakeUI = () => {
        uiLayer.classList.remove("ui-idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => uiLayer.classList.add("ui-idle"), 4500);
      };
      window.addEventListener("pointermove", wakeUI);
      window.addEventListener("pointerdown", wakeUI);
      wakeUI();

      // Camera Preset Buttons (Smooth Fly-To & Walkthrough)
      const presetBtns = document.querySelectorAll(".cam-preset");
      const btnFreeFly = document.getElementById("btn-freefly");
      const godHud = document.getElementById("god-hud");
      const godZone = document.getElementById("god-zone");
      const godAlt = document.getElementById("god-alt");
      const navHint = document.getElementById("nav-hint");

      const syncFreeFlyUI = active => {
        btnFreeFly.classList.toggle("active", active);
        godHud.classList.toggle("visible", active);
        navHint.textContent = active
          ? "Chế độ Thượng Đế đang bật · WASD bay · Kéo chuột nhìn 360° · Cuộn chuột tiến/lùi · Space/E lên · Q/C xuống · Phím F để thoát"
          : "Kéo chuột xoay 360° · Nhấp đúp vào bất kỳ ngôi nhà nào để bay sát tới · WASD di chuyển · Phím F bật Góc Nhìn Thượng Đế";
        if (active) {
          presetBtns.forEach(b => b.classList.remove("active"));
          document.getElementById("btn-autorotate").classList.remove("active");
        }
      };

      cityApp.onModeChange = syncFreeFlyUI;
      cityApp.onHudUpdate = info => {
        if (godZone) godZone.textContent = info.zone;
        if (godAlt) godAlt.textContent = `Cao: ${info.alt}m`;
      };

      btnFreeFly.addEventListener("click", () => {
        cityApp.toggleFreeFly();
      });

      presetBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const preset = btn.dataset.preset;
          presetBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("btn-autorotate").classList.remove("active");
          cityApp.flyToPreset(preset);
        });
      });

      // Audio Controller with Web Audio Synth Fallback
      const audioEl = document.getElementById("bgMusic");
      const btnAudio = document.getElementById("btn-audio");
      const audioLabel = document.getElementById("audio-label");
      let isPlaying = false;
      let synthAudioCtx = null;
      let synthInterval = null;

      function startSynthChristmasMusic() {
        if (synthAudioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        synthAudioCtx = new AudioContext();
        const notes = [659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 783.99, 523.25, 587.33, 659.25];
        const durs  = [0.3, 0.3, 0.6, 0.3, 0.3, 0.6, 0.3, 0.3, 0.4, 0.2, 0.8];
        let idx = 0;
        function nextNote() {
          if (!synthAudioCtx || synthAudioCtx.state === "closed") return;
          const osc = synthAudioCtx.createOscillator();
          const gain = synthAudioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(notes[idx], synthAudioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, synthAudioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, synthAudioCtx.currentTime + durs[idx] * 0.9);
          osc.connect(gain);
          gain.connect(synthAudioCtx.destination);
          osc.start();
          osc.stop(synthAudioCtx.currentTime + durs[idx]);
          idx = (idx + 1) % notes.length;
          synthInterval = setTimeout(nextNote, durs[idx] * 1000);
        }
        nextNote();
      }
      function stopSynthMusic() {
        if (synthInterval) clearTimeout(synthInterval);
        if (synthAudioCtx) { synthAudioCtx.close(); synthAudioCtx = null; }
      }

      btnAudio.addEventListener("click", () => {
        if (!isPlaying) {
          audioEl.play().then(() => {
            isPlaying = true;
            btnAudio.classList.add("audio-playing", "active");
            audioLabel.textContent = "⏸ Tắt";
          }).catch(() => {
            startSynthChristmasMusic();
            isPlaying = true;
            btnAudio.classList.add("audio-playing", "active");
            audioLabel.textContent = "⏸ Tắt";
          });
        } else {
          audioEl.pause();
          stopSynthMusic();
          isPlaying = false;
          btnAudio.classList.remove("audio-playing", "active");
          audioLabel.textContent = "▶ Nhạc";
        }
      });

      // Auto-rotate, Snow & Snapshot Controls
      const btnAutoRot = document.getElementById("btn-autorotate");
      btnAutoRot.addEventListener("click", () => {
        cityApp.walkthroughActive = false;
        cityApp.autoRotate = !cityApp.autoRotate;
        btnAutoRot.classList.toggle("active", cityApp.autoRotate);
      });

      const btnSnow = document.getElementById("btn-snow");
      let snowEnabled = true;
      btnSnow.addEventListener("click", () => {
        snowEnabled = !snowEnabled;
        cityApp.snowPoints.visible = snowEnabled;
        btnSnow.classList.toggle("active", snowEnabled);
      });

      document.getElementById("btn-snapshot").addEventListener("click", () => {
        cityApp.renderer.render(cityApp.scene, cityApp.camera);
        const link = document.createElement("a");
        link.download = `christmas-village-3d-${Date.now()}.png`;
        link.href = cityApp.renderer.domElement.toDataURL("image/png");
        link.click();
      });

      // Archway Signboard Modal
      const modal = document.getElementById("wish-modal");
      const inputTitle = document.getElementById("input-wish-title");
      document.getElementById("btn-open-wish").addEventListener("click", () => modal.classList.add("open"));
      document.getElementById("btn-close-modal").addEventListener("click", () => modal.classList.remove("open"));
      document.getElementById("btn-save-wish").addEventListener("click", () => {
        cityApp.setArchwayText(inputTitle.value.trim() || "CHÚC MỪNG GIÁNG SINH");
        modal.classList.remove("open");
      });
    });
  </script>
</body>
</html>
