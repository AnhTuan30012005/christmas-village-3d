<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D ASCII Christmas Tree — Radiant Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03050a;
      --fg: #e2ecf8;
      --muted: rgba(176, 196, 222, 0.70);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at 50% 44%, #0b1224 0%, #04070f 62%, #020307 100%);
      overflow: hidden;
    }

    #ascii-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #ascii-canvas:active {
      cursor: grabbing;
    }

    /* Ultra-subtle CRT scanline sheen */
    #stage::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.11) 0px,
        rgba(0, 0, 0, 0.11) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.35;
      z-index: 4;
    }

    /* Clean Terminal Telemetry HUD */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-size: clamp(10px, 1.25vw, 13px);
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    .hud-time {
      position: fixed;
      top: calc(16px + var(--safe-top));
      right: clamp(14px, 2.6vw, 28px);
      color: #ff758f;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 14px rgba(255, 117, 143, 0.55);
    }

    .hud-bottom-left {
      position: fixed;
      left: clamp(14px, 2.6vw, 28px);
      bottom: calc(16px + var(--safe-bottom));
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.92);
    }
    .hud-bottom-left .tag {
      color: #93c5fd;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .hud-bottom-left .val {
      color: #fffbeb;
      font-weight: 600;
    }

    .hud-bottom-right {
      position: fixed;
      right: clamp(14px, 2.6vw, 28px);
      bottom: calc(16px + var(--safe-bottom));
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.92);
    }
    .hud-bottom-right .fps {
      color: #4ade80;
      font-weight: 600;
    }

    /* Minimal Top-Left Ghost Controls (Only Music + Replay — zero visual clutter!) */
    .mini-controls {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: clamp(12px, 2.2vw, 24px);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s ease;
    }
    .mini-controls.idle {
      opacity: 0.32;
    }
    .mini-controls:hover,
    .mini-controls:focus-within {
      opacity: 1 !important;
    }

    .ghost-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(8, 12, 22, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(241, 245, 249, 0.88);
      font-family: inherit;
      font-size: clamp(11px, 1.2vw, 12px);
      font-weight: 500;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(253, 224, 71, 0.45);
      color: #fffbeb;
    }
    .ghost-btn.playing {
      border-color: rgba(251, 191, 36, 0.52);
      background: rgba(251, 191, 36, 0.16);
      color: #fde68a;
    }

    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }
    .eq span {
      width: 2px;
      height: 3px;
      background: #fbbf24;
      border-radius: 2px;
    }
    .playing .eq span {
      animation: eq 0.68s ease-in-out infinite alternate;
    }
    .playing .eq span:nth-child(2) { animation-delay: 0.18s; }
    .playing .eq span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes eq {
      0% { height: 3px; }
      100% { height: 10px; }
    }

    @media (max-width: 600px) {
      .hud-bottom-left,
      .hud-bottom-right {
        font-size: 10px;
      }
      .ghost-btn {
        padding: 5px 9px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="ascii-canvas"></canvas>

    <!-- Only 2 ultra-minimal ghost controls: Music & Replay -->
    <div class="mini-controls" id="mini-controls">
      <button class="ghost-btn" id="btn-audio" title="Bật/Tắt nhạc Giáng sinh">
        <span id="audio-lbl">▶ Nhạc</span>
        <span class="eq"><span></span><span></span><span></span></span>
      </button>
      <button class="ghost-btn" id="btn-replay" title="Xem lại từ đầu">↺</button>
    </div>

    <!-- Clean Terminal Telemetry -->
    <div class="hud">
      <div class="hud-time" id="hud-time">t 00.00s</div>

      <div class="hud-bottom-left">
        <div class="tag">@999.2006.01.19 · 2026</div>
        <div>rotation <span class="val" id="hud-rot">000.00°</span> &nbsp;&nbsp; lights <span class="val" id="hud-lights">0</span></div>
        <div>letters <span class="val" id="hud-letters">0</span></div>
      </div>

      <div class="hud-bottom-right">
        running · <span class="fps" id="hud-fps">60 fps</span>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
  (() => {
    "use strict";

    const TAU = Math.PI * 2;

    const T_NEEDLE  = 0;
    const T_SNOWCAP = 1;
    const T_TRUNK   = 2;
    const T_GARLAND = 3;
    const T_LIGHT   = 4;
    const T_BALL    = 5;
    const T_GIFT    = 6;
    const T_STAR    = 7;
    const T_BEAM    = 8;
    const T_GROUND  = 9;

    const SHADE_RAMP = ".:-=+*x%#@";

    const PALETTE = {
      foliage: [
        [28, 138, 62],
        [46, 188, 86],
        [78, 226, 114],
        [20, 108, 48]
      ],
      snow: [246, 251, 255],
      trunk: [164, 102, 54],
      garlandA: [255, 224, 72],
      garlandB: [255, 245, 195],
      star: [255, 242, 128],
      balls: [
        [255, 36, 58],   // Ruby crimson
        [255, 206, 44],  // Liquid gold
        [244, 42, 92],   // Rose ruby
        [56, 214, 255]   // Diamond ice-blue
      ],
      lights: [
        [255, 226, 76],  // Warm champagne gold
        [255, 68, 92],   // Festive ruby
        [72, 234, 255],  // Crystal cyan
        [96, 246, 136],  // Emerald sparkle
        [255, 152, 224], // Pearl rose
        [255, 174, 48]   // Honey amber
      ],
      ground: [176, 196, 224],
      sky: [232, 244, 255]
    };

    class RadiantAsciiTree {
      constructor(canvas, hud) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d", { alpha: false });
        this.hud = hud;

        // Offscreen Bloom Layer for Real Optical Holiday Glow!
        this.bloomCanvas = document.createElement("canvas");
        this.bCtx = this.bloomCanvas.getContext("2d");

        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.cols = 120;
        this.rows = 60;
        this.cellW = 6;
        this.cellH = 10;
        this.fontSize = 10;

        this.yaw = 0.0;
        this.pitch = 0.15;
        this.camDist = 3.55;
        this.autoRotate = true;
        this.rotSpeed = 0.34;

        this.dragging = false;
        this.lastPtr = { x: 0, y: 0 };
        this.pinchDist = 0;

        this.timeline = 0.0;
        this.lastNow = performance.now();
        this.fps = 60;
        this.fpsAcc = 0;
        this.fpsTimer = performance.now();

        this.points = [];
        this.stars = [];
        this.snow = [];
        this.auraDust = [];
        this.sparkleTargets = [];

        this.zBuf = null;
        this.chBuf = null;
        this.rBuf = null;
        this.gBuf = null;
        this.bBuf = null;
        this.glowBuf = null;

        this.buildTreeModel();
        this.buildAtmosphere();
        this.resize();
        this.bindInput();
      }

      envelope(y, Y0, Y1) {
        const f = Math.max(0, Math.min(1, (y - Y0) / (Y1 - Y0)));
        return 0.036 + 0.90 * Math.pow(1 - f, 1.05);
      }

      fibSphere(n) {
        const out = [];
        for (let i = 0; i < n; i++) {
          const idx = i + 0.5;
          const y = 1 - (2 * idx) / n;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const th = Math.PI * (3 - Math.sqrt(5)) * idx;
          out.push({ x: r * Math.cos(th), y, z: r * Math.sin(th) });
        }
        return out;
      }

      buildTreeModel() {
        this.points = [];
        const Y0 = 0.28;
        const Y1 = 2.54;
        const tiers = 26;
        const tips = [];

        let seed = 9973;
        const rnd = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const rndN = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.64;

        // 1. Wide Sparkling Silver Horizon Ground Grid
        const gSpan = 3.75;
        const gStep = 0.082;
        for (let gx = -gSpan; gx <= gSpan; gx += gStep) {
          for (let gz = -gSpan; gz <= gSpan; gz += gStep) {
            const dist = Math.hypot(gx, gz);
            if (dist > gSpan) continue;
            const shadow = dist < 0.92
              ? (0.34 + 0.66 * (dist / 0.92))
              : (1.0 - Math.pow(dist / gSpan, 1.65) * 0.62);
            this.points.push({
              x: gx, y: 0.0, z: gz,
              nx: 0, ny: 1, nz: 0,
              ao: shadow,
              dist,
              type: T_GROUND,
              t0: 0.04 + dist * 0.11,
              glyph: dist < 1.25 ? "=" : (dist < 2.35 ? "-" : ".")
            });
          }
        }

        // 2. Sturdy Trunk Cylinder
        for (let ty = 0.0; ty <= 0.64; ty += 0.030) {
          for (let k = 0; k < 22; k++) {
            const a = (k / 22) * TAU;
            const tr = 0.105;
            this.points.push({
              x: Math.cos(a) * tr,
              y: ty,
              z: Math.sin(a) * tr,
              nx: Math.cos(a), ny: 0, nz: Math.sin(a),
              ao: 0.75 + 0.25 * Math.sin(ty * 60 + a * 3),
              type: T_TRUNK,
              t0: 0.35 + ty * 0.95,
              glyph: ["#", "|", "%", "H"][Math.floor(rnd() * 4)]
            });
          }
        }

        // 3. 26 Ultra-Lush Drooping Emerald Pine Whorls with Frosty Snow Tips
        for (let i = 0; i < tiers; i++) {
          const uTier = i / (tiers - 1);
          const v = Y0 + 0.04 + (Y1 - Y0 - 0.11) * uTier;
          const R = this.envelope(v, Y0, Y1);
          const nb = Math.floor(8 + 12 * (1 - uTier));

          for (let b = 0; b < nb; b++) {
            const a = (TAU * b) / nb + i * 0.618034 * TAU + rndN() * 0.065;
            const L = R * (0.87 + rnd() * 0.19);
            const count = Math.floor(15 + 36 * (L / 0.85));

            const ca = Math.cos(a), sa = Math.sin(a);
            const sx = -sa, sz = ca;

            for (let j = 0; j < count; j++) {
              const s = Math.pow(rnd(), 0.60);
              const spread = (0.03 + 0.11 * s) * rndN() * 0.42;
              const py = v + 0.065 * s * L - 0.205 * Math.pow(s * L, 2) + rndN() * 0.023;
              const px = ca * (s * L) + sx * spread;
              const pz = sa * (s * L) + sz * spread;

              const nx = ca * 0.78 + rndN() * 0.12;
              const ny = 0.54 + rndN() * 0.12;
              const nz = sa * 0.78 + rndN() * 0.12;
              const nL = Math.hypot(nx, ny, nz) || 1;

              const ao = 0.42 + 0.58 * Math.pow(s, 1.05);
              const t0 = 1.0 + 5.6 * uTier + 0.48 * s;
              const isSnow = s > 0.54 && rnd() < 0.095 * s && ny > 0.34;

              this.points.push({
                x: px, y: py, z: pz,
                nx: nx / nL, ny: ny / nL, nz: nz / nL,
                ao,
                type: isSnow ? T_SNOWCAP : T_NEEDLE,
                cIdx: Math.floor(rnd() * 4),
                t0,
                glyph: isSnow
                  ? (rnd() < 0.55 ? "*" : "·")
                  : ["%", "*", "#", "+", "x", "=", ":"][Math.floor(rnd() * 7)]
              });
            }

            const tipY = v + 0.065 * L - 0.205 * L * L;
            tips.push({ x: ca * L * 0.96, y: tipY, z: sa * L * 0.96, nx: ca, nz: sa, uTier });
          }
        }

        // 4. Double Interwoven Shimmering Golden & Champagne Ribbons (with traveling wave!)
        const ribbonCount = 2;
        for (let rIdx = 0; rIdx < ribbonCount; rIdx++) {
          const gPts = 460;
          const turns = 4.6;
          const aOff = rIdx * Math.PI + 0.4;
          for (let g = 0; g < gPts; g++) {
            const u = g / gPts;
            const yg = Y0 + 0.10 + (Y1 - Y0 - 0.28) * u;
            const ag = TAU * turns * u + aOff;
            const swag = -0.052 * Math.abs(Math.sin(ag * 2.5));
            const rg = this.envelope(yg, Y0, Y1) * 1.035 + 0.018;
            this.points.push({
              x: Math.cos(ag) * rg,
              y: yg + swag,
              z: Math.sin(ag) * rg,
              nx: Math.cos(ag), ny: 0.45, nz: Math.sin(ag),
              ao: 1.0,
              u,
              cIdx: rIdx,
              type: T_GARLAND,
              t0: 6.8 + u * 2.1,
              glyph: rIdx === 0 ? ["=", "*", "✦", "~", "o"][g % 5] : ["*", "·", "+", "o"][g % 4]
            });
          }
        }

        // 5. Rich Glossy 3D Jewel Ornaments (Ruby, Liquid Gold, Rose, Diamond Cyan)
        const ballSphere = this.fibSphere(40);
        let ballIdx = 0;
        for (let i = 0; i < tips.length; i += 8) {
          const tip = tips[i];
          if (tip.uTier > 0.89) continue;
          const rad = tip.uTier < 0.35 ? 0.095 : 0.074;
          const cIdx = ballIdx % 4;
          const t0 = 6.6 + tip.uTier * 2.2;
          ballIdx++;
          for (let k = 0; k < ballSphere.length; k++) {
            const bp = ballSphere[k];
            this.points.push({
              x: tip.x + bp.x * rad,
              y: tip.y + bp.y * rad,
              z: tip.z + bp.z * rad,
              nx: bp.x, ny: bp.y, nz: bp.z,
              ao: 1.0,
              type: T_BALL,
              cIdx,
              t0,
              glyph: ["@", "#", "O", "0", "%"][k % 5]
            });
          }
        }

        // 6. 220 Sparkling Jewel Fairy Lights (with optical cross-flare sparkles!)
        let lightCount = 0;
        const stride = Math.max(1, Math.floor(tips.length / 220));
        for (let i = 0; i < tips.length && lightCount < 220; i += stride) {
          const tip = tips[i];
          const lIdx = lightCount++;
          const pt = {
            x: tip.x + (rnd() - 0.5) * 0.055,
            y: tip.y + (rnd() - 0.5) * 0.055,
            z: tip.z + (rnd() - 0.5) * 0.055,
            nx: tip.nx, ny: 0.45, nz: tip.nz,
            ao: 1.0,
            type: T_LIGHT,
            cIdx: lIdx % PALETTE.lights.length,
            phase: rnd() * TAU,
            t0: 7.0 + (lIdx / 220) * 3.8,
            glyph: ["✦", "*", "@", "o", "+"][lIdx % 5]
          };
          this.points.push(pt);
          if (lIdx % 9 === 0) this.sparkleTargets.push(pt);
        }

        // 7. Blazing 3D Golden Star Crown & 12 Crisp Radiating Beams!
        const starY = Y1 + 0.15;
        const starPts = this.fibSphere(92);
        for (let i = 0; i < starPts.length; i++) {
          const p = starPts[i];
          this.points.push({
            x: p.x * 0.105,
            y: starY + p.y * 0.105,
            z: p.z * 0.105,
            nx: p.x, ny: p.y, nz: p.z,
            ao: 1.0,
            type: T_STAR,
            t0: 10.2,
            glyph: ["✦", "@", "#", "8", "*"][i % 5]
          });
        }

        const beams = [
          { dx: 0, dy: 1, dz: 0, ch: "|", len: 0.58 },
          { dx: 0, dy: -0.75, dz: 0, ch: "|", len: 0.30 },
          { dx: 1, dy: 0, dz: 0, ch: "-", len: 0.52 },
          { dx: -1, dy: 0, dz: 0, ch: "-", len: 0.52 },
          { dx: 0.70, dy: 0.71, dz: 0, ch: "/", len: 0.48 },
          { dx: -0.70, dy: 0.71, dz: 0, ch: "\\", len: 0.48 },
          { dx: 0.36, dy: 0.93, dz: 0, ch: "/", len: 0.50 },
          { dx: -0.36, dy: 0.93, dz: 0, ch: "\\", len: 0.50 },
          { dx: 0.65, dy: -0.52, dz: 0, ch: "\\", len: 0.34 },
          { dx: -0.65, dy: -0.52, dz: 0, ch: "/", len: 0.34 },
          { dx: 0, dy: 0.65, dz: 0.76, ch: "|", len: 0.42 },
          { dx: 0, dy: 0.65, dz: -0.76, ch: "|", len: 0.42 }
        ];
        beams.forEach(b => {
          for (let d = 0.13; d <= b.len; d += 0.036) {
            this.points.push({
              x: b.dx * d,
              y: starY + b.dy * d,
              z: b.dz * d,
              nx: b.dx, ny: b.dy, nz: b.dz,
              ao: 1.05 - (d / (b.len + 0.1)) * 0.55,
              type: T_BEAM,
              t0: 10.6 + d * 1.1,
              glyph: d > b.len - 0.06 ? "✦" : b.ch
            });
          }
        });

        // 8. Luminous Wrapped 3D ASCII Gift Boxes Around the Base
        const gifts = [
          { x: -0.60, z: 0.24, w: 0.38, h: 0.30, d: 0.34, body: [242, 184, 38], rib: [232, 34, 52], t0: 11.4 },
          { x: -0.18, z: 0.48, w: 0.46, h: 0.28, d: 0.36, body: [244, 238, 228], rib: [232, 36, 56], t0: 11.8 },
          { x: 0.34, z: 0.44, w: 0.38, h: 0.27, d: 0.34, body: [228, 34, 52], rib: [255, 228, 108], t0: 12.2 },
          { x: 0.68, z: 0.10, w: 0.32, h: 0.24, d: 0.32, body: [226, 236, 248], rib: [236, 40, 58], t0: 12.6 },
          { x: -0.04, z: -0.54, w: 0.44, h: 0.29, d: 0.34, body: [48, 136, 248], rib: [255, 238, 152], t0: 13.0 }
        ];
        gifts.forEach(g => {
          const step = 0.035;
          const hw = g.w / 2, hd = g.d / 2;
          for (let bx = -hw; bx <= hw + 0.001; bx += step) {
            for (let bz = -hd; bz <= hd + 0.001; bz += step) {
              for (let by = 0; by <= g.h + 0.001; by += step) {
                const onFace = Math.abs(bx) >= hw - 0.02 || Math.abs(bz) >= hd - 0.02 || by >= g.h - 0.02;
                if (!onFace) continue;
                const isRib = Math.abs(bx) < 0.036 || Math.abs(bz) < 0.036;
                this.points.push({
                  x: g.x + bx,
                  y: by + 0.02,
                  z: g.z + bz,
                  nx: bx / (hw || 1), ny: by >= g.h - 0.02 ? 1 : 0.25, nz: bz / (hd || 1),
                  ao: 0.96,
                  type: T_GIFT,
                  customCol: isRib ? g.rib : g.body,
                  isRib,
                  t0: g.t0,
                  glyph: isRib ? "#" : (by >= g.h - 0.02 ? "%" : "X")
                });
              }
            }
          }
        });
      }

      buildAtmosphere() {
        // Twinkling starry backdrop
        this.stars = [];
        for (let i = 0; i < 190; i++) {
          this.stars.push({
            u: Math.random(),
            v: Math.random() * 0.78,
            phase: Math.random() * TAU,
            gold: i % 5 === 0,
            glyph: i % 7 === 0 ? "✦" : (i % 4 === 0 ? "*" : "·")
          });
        }
        // Soft falling snowfall
        this.snow = [];
        for (let i = 0; i < 120; i++) {
          this.snow.push({
            u: Math.random(),
            v: Math.random(),
            vy: 0.042 + Math.random() * 0.070,
            vx: (Math.random() - 0.5) * 0.016,
            phase: Math.random() * TAU,
            glyph: i % 4 === 0 ? "*" : (i % 2 === 0 ? "." : "·")
          });
        }
        // 90 Rising Golden Stardust Particles Spiraling Gracefully Around the Tree!
        this.auraDust = [];
        for (let i = 0; i < 90; i++) {
          this.auraDust.push({
            u: Math.random(),
            angle: Math.random() * TAU,
            speedY: 0.055 + Math.random() * 0.065,
            speedA: 0.45 + Math.random() * 0.55,
            rBias: 0.14 + Math.random() * 0.34,
            phase: Math.random() * TAU,
            gold: i % 3 !== 0,
            glyph: i % 4 === 0 ? "✦" : (i % 2 === 0 ? "*" : "·")
          });
        }
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);

        // Quarter-resolution optical bloom buffer (silky lush glow at locked 60 FPS on desktop & mobile!)
        this.bloomScale = 0.28;
        this.bloomCanvas.width = Math.max(1, Math.floor(this.width * this.bloomScale));
        this.bloomCanvas.height = Math.max(1, Math.floor(this.height * this.bloomScale));

        const minDim = Math.min(this.width, this.height);
        if (this.width < 520) {
          this.fontSize = Math.max(6.0, Math.min(7.8, this.width / 54));
        } else if (this.width < 900) {
          this.fontSize = Math.max(7.4, Math.min(9.2, minDim / 84));
        } else {
          this.fontSize = Math.max(8.4, Math.min(10.5, minDim / 88));
        }

        this.cellW = this.fontSize * 0.60;
        this.cellH = this.fontSize * 1.04;
        this.cols = Math.max(56, Math.floor(this.width / this.cellW));
        this.rows = Math.max(42, Math.floor(this.height / this.cellH));

        const total = this.cols * this.rows;
        this.zBuf = new Float32Array(total);
        this.chBuf = new Array(total);
        this.rBuf = new Uint8Array(total);
        this.gBuf = new Uint8Array(total);
        this.bBuf = new Uint8Array(total);
        this.glowBuf = new Uint8Array(total);

        const aspect = this.width / Math.max(1, this.height);
        this.baseDist = aspect < 0.75 ? 4.05 : (aspect < 1.1 ? 3.85 : 3.74);
        if (!this._userZoomed) this.camDist = this.baseDist;
      }

      bindInput() {
        window.addEventListener("resize", () => this.resize());
        const c = this.canvas;

        c.addEventListener("pointerdown", e => {
          if (e.pointerType === "touch") return;
          this.dragging = true;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
        });
        window.addEventListener("pointermove", e => {
          if (!this.dragging || e.pointerType === "touch") return;
          const dx = e.clientX - this.lastPtr.x;
          const dy = e.clientY - this.lastPtr.y;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
          this.yaw += dx * 0.0085;
          this.pitch = Math.max(-0.26, Math.min(0.85, this.pitch + dy * 0.0065));
        });
        window.addEventListener("pointerup", () => { this.dragging = false; });

        c.addEventListener("wheel", e => {
          e.preventDefault();
          this._userZoomed = true;
          this.camDist = Math.max(2.0, Math.min(7.2, this.camDist + Math.sign(e.deltaY) * 0.22));
        }, { passive: false });

        // Mobile Touch Orbit & 2-Finger Pinch Zoom
        c.addEventListener("touchstart", e => {
          if (e.touches.length === 1) {
            this.dragging = true;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            this.dragging = false;
            this.pinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        c.addEventListener("touchmove", e => {
          e.preventDefault();
          if (e.touches.length === 1 && this.dragging) {
            const dx = e.touches[0].clientX - this.lastPtr.x;
            const dy = e.touches[0].clientY - this.lastPtr.y;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
            this.yaw += dx * 0.011;
            this.pitch = Math.max(-0.26, Math.min(0.85, this.pitch + dy * 0.008));
          } else if (e.touches.length === 2) {
            const nd = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            if (this.pinchDist > 0) {
              this._userZoomed = true;
              this.camDist = Math.max(2.0, Math.min(7.2, this.camDist * (this.pinchDist / nd)));
            }
            this.pinchDist = nd;
          }
        }, { passive: false });

        c.addEventListener("touchend", () => {
          this.dragging = false;
          this.pinchDist = 0;
        }, { passive: true });
      }

      replay() {
        this.timeline = 0.0;
        this.yaw = 0.0;
        this.pitch = 0.15;
        this._userZoomed = false;
        this.camDist = this.baseDist;
      }

      showComplete() {
        this.timeline = 16.5;
      }

      drawLensFlare(ctx, x, y, radius, r, g, b, alpha) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        // Soft radial jewel halo
        const gr = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gr.addColorStop(0, `rgba(255,255,245,${(alpha * 0.9).toFixed(2)})`);
        gr.addColorStop(0.28, `rgba(${r},${g},${b},${(alpha * 0.55).toFixed(2)})`);
        gr.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fill();

        // Crisp 4-point optical star cross-glint
        ctx.strokeStyle = `rgba(255,252,235,${(alpha * 0.85).toFixed(2)})`;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(x - radius * 0.95, y);
        ctx.lineTo(x + radius * 0.95, y);
        ctx.moveTo(x, y - radius * 0.95);
        ctx.lineTo(x, y + radius * 0.95);
        ctx.stroke();
        ctx.restore();
      }

      render(now) {
        const dt = Math.min(0.08, Math.max(0.002, (now - this.lastNow) / 1000));
        this.lastNow = now;
        this.timeline += dt;

        this.fpsAcc++;
        if (now - this.fpsTimer >= 400) {
          this.fps = Math.round((this.fpsAcc * 1000) / (now - this.fpsTimer));
          this.fpsAcc = 0;
          this.fpsTimer = now;
        }

        if (this.autoRotate && !this.dragging) {
          this.yaw = (this.yaw + this.rotSpeed * dt) % TAU;
        }

        const cols = this.cols;
        const rows = this.rows;
        const zBuf = this.zBuf;
        const chBuf = this.chBuf;
        const rBuf = this.rBuf;
        const gBuf = this.gBuf;
        const bBuf = this.bBuf;
        const glowBuf = this.glowBuf;

        zBuf.fill(1e9);
        chBuf.fill(null);
        glowBuf.fill(0);

        const ctx = this.ctx;
        const bCtx = this.bCtx;
        const t = this.timeline;

        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        // Deep velvet night backdrop + subtle warm golden atmospheric glow behind tree
        const bgGrad = ctx.createRadialGradient(
          this.width * 0.5, this.height * 0.48, 12,
          this.width * 0.5, this.height * 0.48, Math.max(this.width, this.height) * 0.65
        );
        bgGrad.addColorStop(0.0, "#0c1428");
        bgGrad.addColorStop(0.45, "#050914");
        bgGrad.addColorStop(1.0, "#020307");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        // Clear half-res bloom canvas
        bCtx.clearRect(0, 0, this.bloomCanvas.width, this.bloomCanvas.height);

        const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
        const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
        const lx = 0.42, ly = 0.74, lz = 0.54;

        const centerY = 1.24;
        const projScale = Math.min(this.width * 0.96, this.height * 0.88) * 1.12;
        const halfW = this.width * 0.5;
        const halfH = this.height * 0.53;

        // Warm golden aura glowing softly behind the Christmas tree & floor reflection
        const auraStrength = Math.min(1.0, t / 7.5);
        if (auraStrength > 0.05) {
          const coreRad = Math.min(this.width, this.height) * 0.38;
          const coreGrad = ctx.createRadialGradient(halfW, halfH, 8, halfW, halfH, coreRad);
          coreGrad.addColorStop(0.0, `rgba(255, 196, 68, ${(0.14 * auraStrength).toFixed(3)})`);
          coreGrad.addColorStop(0.45, `rgba(48, 184, 96, ${(0.07 * auraStrength).toFixed(3)})`);
          coreGrad.addColorStop(1.0, "rgba(0,0,0,0)");
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(halfW, halfH, coreRad, 0, TAU);
          ctx.fill();
        }

        // 1. Twinkling Stars & Drifting Snowflakes
        ctx.font = `${this.fontSize}px 'JetBrains Mono', monospace`;
        ctx.textBaseline = "top";
        const [sr, sg, sb] = PALETTE.sky;

        for (let i = 0; i < this.stars.length; i++) {
          const st = this.stars[i];
          const tw = 0.25 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.8 + st.phase));
          ctx.fillStyle = st.gold
            ? `rgba(255,228,132,${tw.toFixed(2)})`
            : `rgba(${sr},${sg},${sb},${tw.toFixed(2)})`;
          ctx.fillText(st.glyph, Math.floor(st.u * cols) * this.cellW, Math.floor(st.v * rows) * this.cellH);
        }

        for (let i = 0; i < this.snow.length; i++) {
          const fl = this.snow[i];
          fl.v = (fl.v + fl.vy * dt) % 1.0;
          fl.u = (fl.u + (fl.vx + Math.sin(t * 0.9 + fl.phase) * 0.012) * dt + 1.0) % 1.0;
          ctx.fillStyle = `rgba(${sr},${sg},${sb},0.78)`;
          ctx.fillText(fl.glyph, Math.floor(fl.u * cols) * this.cellW, Math.floor(fl.v * rows) * this.cellH);
        }

        // 2. Project All 3D Tree Points into Monospace Z-Buffer
        let activeLights = 0;
        let activeLetters = 0;
        const pts = this.points;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (t < p.t0) continue;

          const grow = Math.min(1.0, (t - p.t0) / 0.32);
          const rx = p.x * cy - p.z * sy;
          const rz0 = p.x * sy + p.z * cy;
          const ry0 = (p.y - centerY) * (p.type === T_GROUND ? 1 : (0.86 + 0.14 * grow));

          const ry = ry0 * cp - rz0 * sp;
          const rz = ry0 * sp + rz0 * cp + this.camDist;
          if (rz < 0.35) continue;

          const invZ = projScale / rz;
          const sx = halfW + rx * invZ;
          const sy2 = halfH - ry * invZ;

          const col = Math.floor(sx / this.cellW);
          const row = Math.floor(sy2 / this.cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;

          const cellIdx = row * cols + col;
          if (p.type === T_LIGHT) activeLights++;

          const zBias = (p.type === T_LIGHT || p.type === T_STAR || p.type === T_BEAM || p.type === T_GARLAND) ? -0.06 : 0;
          if (rz + zBias >= zBuf[cellIdx]) continue;
          zBuf[cellIdx] = rz + zBias;

          const rnx = p.nx * cy - p.nz * sy;
          const rnz0 = p.nx * sy + p.nz * cy;
          const rny = p.ny * cp - rnz0 * sp;
          const rnz = p.ny * sp + rnz0 * cp;

          const ndl = Math.max(0, rnx * lx + rny * ly + rnz * lz);
          const shade = Math.min(1.32, (0.50 + 0.72 * ndl) * p.ao);

          let r = 200, g = 200, b = 200;
          let glyph = p.glyph;
          let glow = 0;

          if (p.type === T_NEEDLE) {
            const base = PALETTE.foliage[p.cIdx];
            r = base[0] * shade; g = base[1] * shade; b = base[2] * shade;
            if (ndl > 0.62) {
              const ri = Math.min(SHADE_RAMP.length - 1, Math.floor(shade * (SHADE_RAMP.length - 1)));
              glyph = SHADE_RAMP[ri];
            }
          } else if (p.type === T_SNOWCAP) {
            const s = 0.82 + 0.32 * ndl;
            r = PALETTE.snow[0] * s; g = PALETTE.snow[1] * s; b = PALETTE.snow[2] * s;
            glow = 1;
          } else if (p.type === T_TRUNK) {
            r = PALETTE.trunk[0] * shade; g = PALETTE.trunk[1] * shade; b = PALETTE.trunk[2] * shade;
          } else if (p.type === T_GARLAND) {
            // Traveling shimmering golden light wave spiraling up the ribbon!
            const wave = 0.85 + 0.45 * Math.sin(t * 5.2 - p.u * 22.0 + p.cIdx * 2.0);
            const colG = p.cIdx === 0 ? PALETTE.garlandA : PALETTE.garlandB;
            r = colG[0] * wave; g = colG[1] * wave; b = colG[2] * wave;
            glow = wave > 1.05 ? 2 : 1;
          } else if (p.type === T_BALL) {
            const bc = PALETTE.balls[p.cIdx];
            const spec = Math.pow(Math.max(0, ndl), 3.6) * 185;
            r = bc[0] * shade + spec; g = bc[1] * shade + spec; b = bc[2] * shade + spec;
            if (spec > 65) glyph = "✦";
            glow = spec > 40 ? 2 : 1;
          } else if (p.type === T_LIGHT) {
            const lc = PALETTE.lights[p.cIdx];
            const pulse = 0.72 + 0.58 * Math.sin(t * 5.4 + p.phase);
            r = lc[0] * pulse; g = lc[1] * pulse; b = lc[2] * pulse;
            glow = pulse > 0.95 ? 2 : 1;
          } else if (p.type === T_STAR || p.type === T_BEAM) {
            const pulse = p.type === T_STAR ? (1.02 + 0.24 * Math.sin(t * 5.8)) : (p.ao * (0.9 + 0.22 * Math.sin(t * 4.5)));
            r = PALETTE.star[0] * pulse; g = PALETTE.star[1] * pulse; b = PALETTE.star[2] * pulse;
            glow = 2;
          } else if (p.type === T_GIFT) {
            const gc = p.customCol;
            const gs = 0.62 + 0.56 * ndl;
            r = gc[0] * gs; g = gc[1] * gs; b = gc[2] * gs;
            if (p.isRib) glow = 1;
          } else if (p.type === T_GROUND) {
            // Subtle golden glow reflection pooling on the silver floor near the tree base!
            const warmBoost = p.dist < 1.35 ? (1 - p.dist / 1.35) * 0.45 * auraStrength : 0;
            const gs = p.ao * 0.78;
            r = PALETTE.ground[0] * gs + 255 * warmBoost;
            g = PALETTE.ground[1] * gs + 195 * warmBoost;
            b = PALETTE.ground[2] * gs + 70 * warmBoost;
          }

          chBuf[cellIdx] = glyph;
          rBuf[cellIdx] = Math.min(255, Math.max(0, r));
          gBuf[cellIdx] = Math.min(255, Math.max(0, g));
          bBuf[cellIdx] = Math.min(255, Math.max(0, b));
          glowBuf[cellIdx] = glow;
        }

        // 3. Flush Crisp Monospace Characters + Populate Offscreen Optical Bloom Buffer
        ctx.font = `600 ${this.fontSize}px 'JetBrains Mono', monospace`;
        bCtx.font = `700 ${this.fontSize * this.bloomScale}px 'JetBrains Mono', monospace`;
        bCtx.textBaseline = "top";
        const bs = this.bloomScale;

        for (let row = 0; row < rows; row++) {
          const py = row * this.cellH;
          const bpy = py * bs;
          const rowOff = row * cols;
          for (let col = 0; col < cols; col++) {
            const idx = rowOff + col;
            const ch = chBuf[idx];
            if (!ch) continue;
            activeLetters++;
            const r = rBuf[idx], g = gBuf[idx], b = bBuf[idx];
            const px = col * this.cellW;
            const rgb = `rgb(${r},${g},${b})`;
            ctx.fillStyle = rgb;
            ctx.fillText(ch, px, py);

            // Paint radiant items into offscreen bloom buffer
            const gl = glowBuf[idx];
            if (gl > 0) {
              bCtx.fillStyle = rgb;
              bCtx.fillText(ch, px * bs, bpy);
              if (gl === 2) {
                bCtx.fillText(ch, px * bs, bpy); // double intensity for star & jewel peaks
              }
            }
          }
        }

        // 4. Rising Golden Stardust Spiral Around the Tree (Painted into BOTH main & bloom!)
        if (t > 2.2) {
          const dustAlpha = Math.min(1, (t - 2.2) / 2.5);
          for (let i = 0; i < this.auraDust.length; i++) {
            const d = this.auraDust[i];
            d.u = (d.u + d.speedY * dt) % 1.0;
            d.angle += d.speedA * dt;

            const dy = 0.25 + d.u * 2.55;
            const dr = this.envelope(dy, 0.28, 2.54) + d.rBias;
            const wx = Math.cos(d.angle) * dr;
            const wz = Math.sin(d.angle) * dr;

            const rx = wx * cy - wz * sy;
            const rz0 = wx * sy + wz * cy;
            const ry0 = dy - centerY;
            const ry = ry0 * cp - rz0 * sp;
            const rz = ry0 * sp + rz0 * cp + this.camDist;
            if (rz < 0.4) continue;

            const invZ = projScale / rz;
            const sx = halfW + rx * invZ;
            const sy2 = halfH - ry * invZ;
            const fade = Math.sin(d.u * Math.PI) * (0.45 + 0.55 * Math.sin(t * 5.0 + d.phase)) * dustAlpha;
            if (fade < 0.08) continue;

            const colStr = d.gold
              ? `rgba(255,226,112,${fade.toFixed(2)})`
              : `rgba(148,232,255,${fade.toFixed(2)})`;
            ctx.fillStyle = colStr;
            ctx.fillText(d.glyph, sx, sy2);
            bCtx.fillStyle = colStr;
            bCtx.fillText(d.glyph, sx * bs, sy2 * bs);
          }
        }

        // 5. Composite Dual-Pass Optical Bloom (Ultra-fast Quarter-Res Hardware-Smooth Glow!)
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.filter = "blur(4px)";
        ctx.globalAlpha = 0.90;
        ctx.drawImage(this.bloomCanvas, 0, 0, this.width, this.height);

        ctx.filter = "blur(10px)";
        ctx.globalAlpha = 0.55;
        ctx.drawImage(this.bloomCanvas, 0, 0, this.width, this.height);
        ctx.restore();

        // 6. Optical Cross-Flare Starburst Glints on Star Topper & Brightest Fairy Lights!
        if (t >= 10.2) {
          const syStar = (2.69 - centerY) * cp;
          const szStar = (2.69 - centerY) * sp + this.camDist;
          if (szStar > 0.35) {
            const sPx = halfW;
            const sPy = halfH - syStar * (projScale / szStar);
            const starRad = Math.min(this.width, this.height) * (0.11 + 0.015 * Math.sin(t * 4.5));
            this.drawLensFlare(ctx, sPx, sPy, starRad, 255, 224, 96, 0.82);
          }
        }

        // Shimmering mini jewel flares twinkling across the tree canopy
        for (let i = 0; i < this.sparkleTargets.length; i++) {
          const p = this.sparkleTargets[i];
          if (t < p.t0) continue;
          const flash = Math.sin(t * 4.2 + p.phase * 2.0);
          if (flash < 0.72) continue;

          const rx = p.x * cy - p.z * sy;
          const rz0 = p.x * sy + p.z * cy;
          if (rz0 > 0.25) continue; // only sparkle front-facing lights!
          const ry0 = p.y - centerY;
          const ry = ry0 * cp - rz0 * sp;
          const rz = ry0 * sp + rz0 * cp + this.camDist;
          if (rz < 0.35) continue;

          const invZ = projScale / rz;
          const sx = halfW + rx * invZ;
          const sy2 = halfH - ry * invZ;
          const intensity = (flash - 0.72) / 0.28;
          const lc = PALETTE.lights[p.cIdx];
          this.drawLensFlare(ctx, sx, sy2, 12 + intensity * 14, lc[0], lc[1], lc[2], intensity * 0.78);
        }

        ctx.restore();

        // 7. Update Telemetry HUD
        const deg = (((this.yaw * 180) / Math.PI) % 360 + 360) % 360;
        this.hud.time.textContent = `t ${t.toFixed(2).padStart(5, "0")}s`;
        this.hud.rot.textContent = `${deg.toFixed(2).padStart(6, "0")}°`;
        this.hud.lights.textContent = activeLights;
        this.hud.letters.textContent = activeLetters.toLocaleString("en-US");
        this.hud.fps.textContent = `${this.fps} fps`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("ascii-canvas");
      const hud = {
        time: document.getElementById("hud-time"),
        rot: document.getElementById("hud-rot"),
        lights: document.getElementById("hud-lights"),
        letters: document.getElementById("hud-letters"),
        fps: document.getElementById("hud-fps")
      };

      const app = new RadiantAsciiTree(canvas, hud);
      window.asciiTreeApp = app;

      function loop(now) {
        app.render(now);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // Auto-fade the 2 tiny top-left buttons after inactivity
      const mini = document.getElementById("mini-controls");
      let idleTimer = null;
      const wake = () => {
        mini.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => mini.classList.add("idle"), 3500);
      };
      window.addEventListener("pointermove", wake);
      window.addEventListener("pointerdown", wake);
      wake();

      document.getElementById("btn-replay").addEventListener("click", () => app.replay());

      // Music Toggle with Web Audio Synth Fallback
      const audioEl = document.getElementById("bgMusic");
      const btnAudio = document.getElementById("btn-audio");
      const audioLbl = document.getElementById("audio-lbl");
      let isPlaying = false;
      let synthCtx = null, synthTimer = null;

      function startSynth() {
        if (synthCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        synthCtx = new AC();
        const notes = [659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 783.99, 523.25, 587.33, 659.25];
        const durs  = [0.3, 0.3, 0.6, 0.3, 0.3, 0.6, 0.3, 0.3, 0.4, 0.2, 0.8];
        let idx = 0;
        const next = () => {
          if (!synthCtx || synthCtx.state === "closed") return;
          const osc = synthCtx.createOscillator();
          const g = synthCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(notes[idx], synthCtx.currentTime);
          g.gain.setValueAtTime(0.08, synthCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, synthCtx.currentTime + durs[idx] * 0.9);
          osc.connect(g); g.connect(synthCtx.destination);
          osc.start(); osc.stop(synthCtx.currentTime + durs[idx]);
          idx = (idx + 1) % notes.length;
          synthTimer = setTimeout(next, durs[idx] * 1000);
        };
        next();
      }
      function stopSynth() {
        if (synthTimer) clearTimeout(synthTimer);
        if (synthCtx) { synthCtx.close(); synthCtx = null; }
      }

      btnAudio.addEventListener("click", () => {
        if (!isPlaying) {
          audioEl.play().then(() => {
            isPlaying = true;
            btnAudio.classList.add("playing");
            audioLbl.textContent = "⏸ Tắt";
          }).catch(() => {
            startSynth();
            isPlaying = true;
            btnAudio.classList.add("playing");
            audioLbl.textContent = "⏸ Tắt";
          });
        } else {
          audioEl.pause();
          stopSynth();
          isPlaying = false;
          btnAudio.classList.remove("playing");
          audioLbl.textContent = "▶ Nhạc";
        }
      });
    });
  })();
  </script>
</body>
</html>
