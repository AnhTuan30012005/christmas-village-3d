<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D ASCII Christmas Tree — Pure Terminal Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070c;
      --fg: #d6e2f0;
      --muted: rgba(164, 182, 206, 0.72);
      --accent: #f87171;
      --gold: #fbbf24;
      --glass: rgba(9, 13, 22, 0.72);
      --border: rgba(255, 255, 255, 0.12);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at 50% 42%, #0b101d 0%, #05070c 68%, #020306 100%);
      overflow: hidden;
    }

    #ascii-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #ascii-canvas:active {
      cursor: grabbing;
    }

    /* Subtle optional CRT scanline texture */
    #stage.crt::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.45;
      z-index: 4;
    }

    /* Minimal Authentic Terminal Telemetry HUD (Matches original video style, zero code panel!) */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-size: clamp(10.5px, 1.35vw, 13.5px);
      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    .hud-time {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: clamp(14px, 2.6vw, 28px);
      color: #ff6b81;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(255, 107, 129, 0.45);
    }

    .hud-bottom-left {
      position: fixed;
      left: clamp(14px, 2.6vw, 28px);
      bottom: calc(74px + var(--safe-bottom));
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    .hud-bottom-left .tag {
      color: #93c5fd;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .hud-bottom-left .val {
      color: #f8fafc;
      font-weight: 600;
    }

    .hud-bottom-right {
      position: fixed;
      right: clamp(14px, 2.6vw, 28px);
      bottom: calc(74px + var(--safe-bottom));
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    .hud-bottom-right .fps {
      color: #4ade80;
      font-weight: 600;
    }

    /* Responsive Floating Bottom Glass Control Bar */
    .dock-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(16px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 20;
      max-width: calc(100vw - 20px);
      transition: opacity 0.45s ease;
    }
    .dock-wrap.idle {
      opacity: 0.36;
    }
    .dock-wrap:hover,
    .dock-wrap:focus-within {
      opacity: 1 !important;
    }

    .dock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      overflow-x: auto;
      max-width: calc(100vw - 20px);
      scrollbar-width: none;
    }
    .dock::-webkit-scrollbar {
      display: none;
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(226, 232, 240, 0.88);
      font-family: inherit;
      font-size: clamp(11px, 1.25vw, 12.5px);
      font-weight: 500;
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
    }
    .btn.active {
      background: rgba(251, 191, 36, 0.16);
      border-color: rgba(251, 191, 36, 0.44);
      color: #fde68a;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.78), rgba(16, 185, 129, 0.78));
      border-color: rgba(134, 239, 172, 0.45);
      color: #f0fdf4;
      font-weight: 600;
    }

    .sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* Audio Equalizer Bars */
    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
    }
    .eq span {
      width: 2px;
      height: 3px;
      background: #fbbf24;
      border-radius: 2px;
    }
    .playing .eq span {
      animation: eq 0.7s ease-in-out infinite alternate;
    }
    .playing .eq span:nth-child(2) { animation-delay: 0.18s; }
    .playing .eq span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes eq {
      0% { height: 3px; }
      100% { height: 11px; }
    }

    /* Mobile & Compact Portrait Layout */
    @media (max-width: 640px) {
      .hud-bottom-left {
        bottom: calc(68px + var(--safe-bottom));
        font-size: 10.5px;
      }
      .hud-bottom-right {
        bottom: calc(68px + var(--safe-bottom));
        font-size: 10.5px;
      }
      .dock {
        gap: 2px;
        padding: 5px 6px;
      }
      .btn {
        padding: 6px 7.5px;
        font-size: 10.5px;
        gap: 3px;
      }
      .btn .hide-sm {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="stage" class="crt">
    <canvas id="ascii-canvas"></canvas>

    <!-- Pure Terminal Telemetry Overlay (Zero Code Panel) -->
    <div class="hud">
      <div class="hud-time" id="hud-time">t 00.00s</div>

      <div class="hud-bottom-left">
        <div class="tag">@999.2006.01.19 · 2026</div>
        <div>rotation <span class="val" id="hud-rot">000.00°</span> &nbsp;&nbsp; lights <span class="val" id="hud-lights">0</span></div>
        <div>letters <span class="val" id="hud-letters">0</span></div>
      </div>

      <div class="hud-bottom-right">
        running · <span class="fps" id="hud-fps">60 fps</span>
      </div>
    </div>

    <!-- Minimal Responsive Control Dock -->
    <div class="dock-wrap" id="dock-wrap">
      <div class="dock">
        <button class="btn primary" id="btn-replay" title="Chạy lại hiệu ứng mọc cây từ 0s">↺ <span class="hide-sm">Dựng Lại</span></button>
        <button class="btn" id="btn-full" title="Hiển thị ngay cây hoàn chỉnh">⚡ <span class="hide-sm">Đầy Đủ</span></button>
        <div class="sep"></div>
        <button class="btn" id="btn-audio" title="Bật/Tắt nhạc Giáng sinh">
          <span id="audio-lbl">▶ Nhạc</span>
          <span class="eq"><span></span><span></span><span></span></span>
        </button>
        <button class="btn" id="btn-theme" title="Đổi bảng màu (Classic / Neon / Băng / Hoàng Kim)">🎨 <span id="theme-lbl">Classic</span></button>
        <button class="btn active" id="btn-spin" title="Tự xoay 360°">🔄 <span class="hide-sm">Xoay</span></button>
        <button class="btn active" id="btn-crt" title="Bật/Tắt đường quét CRT">📺 <span class="hide-sm">CRT</span></button>
        <button class="btn" id="btn-snap" title="Lưu ảnh PNG">📸 <span class="hide-sm">Chụp</span></button>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
  (() => {
    "use strict";

    const TAU = Math.PI * 2;

    // Element types
    const T_NEEDLE  = 0;
    const T_SNOWCAP = 1;
    const T_TRUNK   = 2;
    const T_GARLAND = 3;
    const T_LIGHT   = 4;
    const T_BALL    = 5;
    const T_GIFT    = 6;
    const T_STAR    = 7;
    const T_BEAM    = 8;
    const T_GROUND  = 9;

    const SHADE_RAMP = ".:-=+*x%#@";

    const THEMES = [
      {
        key: "classic",
        label: "Classic",
        foliage: [[34, 136, 56], [48, 178, 76], [74, 214, 98], [26, 108, 44]],
        snow: [242, 248, 255],
        trunk: [156, 98, 52],
        garland: [255, 220, 56],
        star: [255, 236, 102],
        balls: [[238, 34, 48], [252, 204, 38], [228, 28, 46], [255, 172, 34]],
        lights: [[255, 66, 80], [255, 220, 52], [68, 230, 255], [84, 232, 118], [255, 134, 206]],
        ground: [172, 188, 212],
        sky: [228, 240, 255]
      },
      {
        key: "arctic",
        label: "Băng Tuyết",
        foliage: [[36, 98, 136], [62, 146, 188], [116, 194, 228], [26, 68, 102]],
        snow: [250, 253, 255],
        trunk: [90, 108, 132],
        garland: [204, 240, 255],
        star: [236, 248, 255],
        balls: [[96, 188, 255], [240, 248, 255], [148, 168, 255], [56, 218, 245]],
        lights: [[128, 224, 255], [255, 255, 255], [165, 188, 255], [72, 198, 248], [220, 246, 255]],
        ground: [108, 138, 174],
        sky: [235, 248, 255]
      },
      {
        key: "cyber",
        label: "Neon",
        foliage: [[12, 92, 96], [0, 174, 162], [18, 224, 198], [16, 54, 82]],
        snow: [255, 126, 218],
        trunk: [88, 44, 122],
        garland: [0, 255, 242],
        star: [255, 56, 156],
        balls: [[255, 36, 140], [0, 245, 230], [255, 220, 48], [186, 76, 255]],
        lights: [[255, 42, 146], [0, 255, 240], [255, 232, 64], [190, 72, 255], [80, 255, 168]],
        ground: [96, 74, 142],
        sky: [170, 245, 255]
      },
      {
        key: "gold",
        label: "Hoàng Kim",
        foliage: [[86, 66, 22], [142, 108, 34], [196, 152, 48], [62, 48, 18]],
        snow: [255, 244, 214],
        trunk: [110, 72, 34],
        garland: [255, 238, 145],
        star: [255, 250, 190],
        balls: [[245, 196, 42], [226, 66, 46], [255, 232, 130], [235, 128, 36]],
        lights: [[255, 224, 82], [255, 164, 52], [255, 246, 175], [255, 92, 58], [255, 206, 110]],
        ground: [132, 114, 86],
        sky: [255, 245, 216]
      }
    ];

    class PureAsciiTreeApp {
      constructor(canvas, hud) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d", { alpha: false });
        this.hud = hud;

        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Monospace Terminal Grid Dimensions (computed responsively)
        this.cols = 120;
        this.rows = 60;
        this.cellW = 8;
        this.cellH = 14;
        this.fontSize = 12;

        // Camera & Orbit State
        this.yaw = 0.0;
        this.pitch = 0.16;
        this.camDist = 3.75;
        this.autoRotate = true;
        this.rotSpeed = 0.34; // rad/s matching video pace

        // Interactive Drag / Touch Pinch State
        this.dragging = false;
        this.lastPtr = { x: 0, y: 0 };
        this.pinchDist = 0;

        // Timeline (Starts at t = 0.00s growing smoothly like the video!)
        this.timeline = 0.0;
        this.lastNow = performance.now();
        this.fps = 60;
        this.fpsAcc = 0;
        this.fpsTimer = performance.now();

        this.themeIdx = 0;
        this.theme = THEMES[0];

        // Model & Sky Buffers
        this.points = [];
        this.stars = [];
        this.snow = [];
        this.totalLights = 0;

        // Z-Buffer Arrays (reallocated on resize only)
        this.zBuf = null;
        this.chBuf = null;
        this.rBuf = null;
        this.gBuf = null;
        this.bBuf = null;
        this.glowBuf = null;

        this.buildTreeModel();
        this.buildSkyAndSnow();
        this.resize();
        this.bindInput();
      }

      // Cone envelope matching agac.py silhouette
      envelope(y, Y0, Y1) {
        const f = Math.max(0, Math.min(1, (y - Y0) / (Y1 - Y0)));
        return 0.035 + 0.88 * Math.pow(1 - f, 1.06);
      }

      fibSphere(n) {
        const out = [];
        for (let i = 0; i < n; i++) {
          const idx = i + 0.5;
          const y = 1 - (2 * idx) / n;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const th = Math.PI * (3 - Math.sqrt(5)) * idx;
          out.push({ x: r * Math.cos(th), y, z: r * Math.sin(th) });
        }
        return out;
      }

      buildTreeModel() {
        this.points = [];
        const Y0 = 0.28;
        const Y1 = 2.52;
        const tiers = 24;
        const tips = [];

        // Deterministic PRNG for consistent rich foliage
        let seed = 7919;
        const rnd = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const rndN = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.65;

        // 1. Perspective Dotted Ground Grid Plane (wide sparkling silver horizon matching reference video!)
        const gSpan = 3.55;
        const gStep = 0.082;
        for (let gx = -gSpan; gx <= gSpan; gx += gStep) {
          for (let gz = -gSpan; gz <= gSpan; gz += gStep) {
            const dist = Math.hypot(gx, gz);
            if (dist > gSpan) continue;
            const shadow = dist < 0.94 ? (0.30 + 0.70 * (dist / 0.94)) : (1.0 - Math.pow(dist / gSpan, 1.7) * 0.62);
            this.points.push({
              x: gx, y: 0.0, z: gz,
              nx: 0, ny: 1, nz: 0,
              ao: shadow,
              type: T_GROUND,
              t0: 0.05 + dist * 0.12,
              glyph: dist < 1.25 ? "=" : (dist < 2.25 ? "-" : ".")
            });
          }
        }

        // 2. Sturdy Trunk Cylinder
        for (let ty = 0.0; ty <= 0.62; ty += 0.032) {
          for (let k = 0; k < 20; k++) {
            const a = (k / 20) * TAU;
            const tr = 0.105;
            this.points.push({
              x: Math.cos(a) * tr,
              y: ty,
              z: Math.sin(a) * tr,
              nx: Math.cos(a), ny: 0, nz: Math.sin(a),
              ao: 0.72 + 0.28 * Math.sin(ty * 65 + a * 3),
              type: T_TRUNK,
              t0: 0.4 + ty * 1.1,
              glyph: ["#", "|", "%", "H"][Math.floor(rnd() * 4)]
            });
          }
        }

        // 3. 24 Dense Drooping Pine Branch Tiers (agac.py whorls!)
        for (let i = 0; i < tiers; i++) {
          const uTier = i / (tiers - 1);
          const v = Y0 + 0.04 + (Y1 - Y0 - 0.12) * uTier;
          const R = this.envelope(v, Y0, Y1);
          const nb = Math.floor(7 + 11 * (1 - uTier));

          for (let b = 0; b < nb; b++) {
            const a = (TAU * b) / nb + i * 0.618034 * TAU + rndN() * 0.07;
            const L = R * (0.86 + rnd() * 0.20);
            const count = Math.floor(14 + 34 * (L / 0.85));

            const ca = Math.cos(a), sa = Math.sin(a);
            const sx = -sa, sz = ca;

            for (let j = 0; j < count; j++) {
              const s = Math.pow(rnd(), 0.62);
              const spread = (0.03 + 0.11 * s) * rndN() * 0.42;
              const py = v + 0.065 * s * L - 0.21 * Math.pow(s * L, 2) + rndN() * 0.024;
              const px = ca * (s * L) + sx * spread;
              const pz = sa * (s * L) + sz * spread;

              const nx = ca * 0.78 + rndN() * 0.12;
              const ny = 0.52 + rndN() * 0.12;
              const nz = sa * 0.78 + rndN() * 0.12;
              const nL = Math.hypot(nx, ny, nz) || 1;

              const ao = 0.34 + 0.66 * Math.pow(s, 1.15);
              const t0 = 1.2 + 6.2 * uTier + 0.55 * s;
              const isSnow = s > 0.56 && rnd() < 0.075 * s && ny > 0.35;

              this.points.push({
                x: px, y: py, z: pz,
                nx: nx / nL, ny: ny / nL, nz: nz / nL,
                ao,
                type: isSnow ? T_SNOWCAP : T_NEEDLE,
                cIdx: Math.floor(rnd() * 4),
                t0,
                glyph: isSnow
                  ? (rnd() < 0.5 ? "*" : ".")
                  : ["%", "*", "#", "+", "x", "=", ":"][Math.floor(rnd() * 7)]
              });
            }

            const tipY = v + 0.065 * L - 0.21 * L * L;
            tips.push({ x: ca * L * 0.95, y: tipY, z: sa * L * 0.95, nx: ca, nz: sa, uTier });
          }
        }

        // 4. Shimmering Golden Tinsel Garland Spiraling up the Tree
        const gPts = 420;
        const turns = 4.2;
        for (let g = 0; g < gPts; g++) {
          const u = g / gPts;
          const yg = Y0 + 0.12 + (Y1 - Y0 - 0.32) * u;
          const ag = TAU * turns * u + 0.6;
          const swag = -0.055 * Math.abs(Math.sin(ag * 2.5));
          const rg = this.envelope(yg, Y0, Y1) * 1.03 + 0.015;
          this.points.push({
            x: Math.cos(ag) * rg,
            y: yg + swag,
            z: Math.sin(ag) * rg,
            nx: Math.cos(ag), ny: 0.45, nz: Math.sin(ag),
            ao: 1.0,
            type: T_GARLAND,
            t0: 8.2 + u * 2.2,
            glyph: ["=", "~", "*", "o", "#"][g % 5]
          });
        }

        // 5. Lush Spherical 3D Ornaments (Big Red & Gold Globes clearly visible like reference video!)
        const ballSphere = this.fibSphere(38);
        let ballIdx = 0;
        for (let i = 0; i < tips.length; i += 7) {
          const tip = tips[i];
          if (tip.uTier > 0.88) continue;
          const rad = tip.uTier < 0.35 ? 0.092 : 0.072;
          const cIdx = ballIdx % 4;
          const t0 = 7.6 + tip.uTier * 2.4;
          ballIdx++;
          for (let k = 0; k < ballSphere.length; k++) {
            const bp = ballSphere[k];
            this.points.push({
              x: tip.x + bp.x * rad,
              y: tip.y + bp.y * rad,
              z: tip.z + bp.z * rad,
              nx: bp.x, ny: bp.y, nz: bp.z,
              ao: 0.95,
              type: T_BALL,
              cIdx,
              t0,
              glyph: ["@", "#", "O", "0", "%"][k % 5]
            });
          }
        }

        // 6. Exactly 170 Twinkling Multi-Color Fairy Lights (matching video telemetry `lights 170`!)
        let lightCount = 0;
        const stride = Math.max(1, Math.floor(tips.length / 170));
        for (let i = 0; i < tips.length && lightCount < 170; i += stride) {
          const tip = tips[i];
          const lIdx = lightCount++;
          this.points.push({
            x: tip.x + (rnd() - 0.5) * 0.05,
            y: tip.y + (rnd() - 0.5) * 0.05,
            z: tip.z + (rnd() - 0.5) * 0.05,
            nx: tip.nx, ny: 0.4, nz: tip.nz,
            ao: 1.0,
            type: T_LIGHT,
            cIdx: lIdx % 5,
            phase: rnd() * TAU,
            t0: 8.0 + (lIdx / 170) * 4.2,
            glyph: ["@", "*", "o", "+"][lIdx % 4]
          });
        }
        this.totalLights = lightCount;

        // 7. Radiant 3D Golden Star Topper & 8 Crisp ASCII Light Beams
        const starY = Y1 + 0.14;
        const starPts = this.fibSphere(75);
        for (let i = 0; i < starPts.length; i++) {
          const p = starPts[i];
          this.points.push({
            x: p.x * 0.095,
            y: starY + p.y * 0.095,
            z: p.z * 0.095,
            nx: p.x, ny: p.y, nz: p.z,
            ao: 1.0,
            type: T_STAR,
            t0: 11.8,
            glyph: ["@", "#", "8", "*", "+"][i % 5]
          });
        }

        const beams = [
          { dx: 0, dy: 1, dz: 0, ch: "|" },
          { dx: 1, dy: 0, dz: 0, ch: "-" },
          { dx: -1, dy: 0, dz: 0, ch: "-" },
          { dx: 0.62, dy: 0.78, dz: 0, ch: "/" },
          { dx: -0.62, dy: 0.78, dz: 0, ch: "\\" },
          { dx: 0.34, dy: 0.94, dz: 0, ch: "/" },
          { dx: -0.34, dy: 0.94, dz: 0, ch: "\\" },
          { dx: 0, dy: 0.72, dz: 0.68, ch: "|" }
        ];
        beams.forEach(b => {
          for (let d = 0.14; d <= 0.48; d += 0.038) {
            this.points.push({
              x: b.dx * d,
              y: starY + b.dy * d,
              z: b.dz * d,
              nx: b.dx, ny: b.dy, nz: b.dz,
              ao: 1.0 - (d / 0.56) * 0.55,
              type: T_BEAM,
              t0: 12.2 + d * 1.4,
              glyph: d > 0.42 ? "." : b.ch
            });
          }
        });

        // 8. Generous Wrapped 3D ASCII Gift Boxes Resting Around the Base (exact video proportions!)
        const gifts = [
          { x: -0.58, z: 0.22, w: 0.36, h: 0.30, d: 0.34, body: [224, 172, 34], rib: [215, 32, 46], t0: 13.0 },
          { x: -0.18, z: 0.46, w: 0.46, h: 0.28, d: 0.36, body: [232, 224, 212], rib: [210, 34, 48], t0: 13.5 },
          { x: 0.32, z: 0.42, w: 0.38, h: 0.26, d: 0.34, body: [204, 34, 48], rib: [255, 224, 108], t0: 14.0 },
          { x: 0.66, z: 0.10, w: 0.32, h: 0.24, d: 0.32, body: [220, 228, 240], rib: [224, 38, 52], t0: 14.4 },
          { x: -0.04, z: -0.52, w: 0.42, h: 0.28, d: 0.34, body: [42, 118, 232], rib: [255, 236, 150], t0: 14.8 }
        ];
        gifts.forEach(g => {
          const step = 0.036;
          const hw = g.w / 2, hd = g.d / 2;
          for (let bx = -hw; bx <= hw + 0.001; bx += step) {
            for (let bz = -hd; bz <= hd + 0.001; bz += step) {
              for (let by = 0; by <= g.h + 0.001; by += step) {
                const onFace = Math.abs(bx) >= hw - 0.02 || Math.abs(bz) >= hd - 0.02 || by >= g.h - 0.02;
                if (!onFace) continue;
                const isRib = Math.abs(bx) < 0.035 || Math.abs(bz) < 0.035;
                this.points.push({
                  x: g.x + bx,
                  y: by + 0.02,
                  z: g.z + bz,
                  nx: bx / (hw || 1), ny: by >= g.h - 0.02 ? 1 : 0.2, nz: bz / (hd || 1),
                  ao: 0.92,
                  type: T_GIFT,
                  customCol: isRib ? g.rib : g.body,
                  t0: g.t0,
                  glyph: isRib ? "#" : (by >= g.h - 0.02 ? "%" : "X")
                });
              }
            }
          }
        });
      }

      buildSkyAndSnow() {
        this.stars = [];
        for (let i = 0; i < 160; i++) {
          this.stars.push({
            u: Math.random(),
            v: Math.random() * 0.76,
            phase: Math.random() * TAU,
            glyph: i % 5 === 0 ? "*" : (i % 3 === 0 ? "·" : ".")
          });
        }
        this.snow = [];
        for (let i = 0; i < 110; i++) {
          this.snow.push({
            u: Math.random(),
            v: Math.random(),
            vy: 0.045 + Math.random() * 0.075,
            vx: (Math.random() - 0.5) * 0.018,
            phase: Math.random() * TAU,
            glyph: i % 4 === 0 ? "*" : (i % 2 === 0 ? "." : "·")
          });
        }
      }

      // Responsive Terminal Grid Auto-Sizer (works crisply on 9:16 mobile, tablet & 16:9/21:9 desktop!)
      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);

        // High-density crisp monospace cell sizing (~5,000–8,500 letters matching agac.py video fidelity!)
        const minDim = Math.min(this.width, this.height);
        if (this.width < 520) {
          this.fontSize = Math.max(5.8, Math.min(7.4, this.width / 58));
        } else if (this.width < 900) {
          this.fontSize = Math.max(7.2, Math.min(9.0, minDim / 88));
        } else {
          this.fontSize = Math.max(8.2, Math.min(10.2, minDim / 92));
        }

        this.cellW = this.fontSize * 0.60;
        this.cellH = this.fontSize * 1.04;
        this.cols = Math.max(56, Math.floor(this.width / this.cellW));
        this.rows = Math.max(42, Math.floor(this.height / this.cellH));

        const total = this.cols * this.rows;
        this.zBuf = new Float32Array(total);
        this.chBuf = new Array(total);
        this.rBuf = new Uint8Array(total);
        this.gBuf = new Uint8Array(total);
        this.bBuf = new Uint8Array(total);
        this.glowBuf = new Uint8Array(total);

        // Adjust default camera distance gently for tall portrait mobile vs wide desktop
        const aspect = this.width / Math.max(1, this.height);
        this.baseDist = aspect < 0.75 ? 4.25 : (aspect < 1.1 ? 3.95 : 3.65);
        if (!this._userZoomed) this.camDist = this.baseDist;
      }

      bindInput() {
        window.addEventListener("resize", () => this.resize());
        const c = this.canvas;

        // Mouse Drag Orbit
        c.addEventListener("pointerdown", e => {
          if (e.pointerType === "touch") return;
          this.dragging = true;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
        });
        window.addEventListener("pointermove", e => {
          if (!this.dragging || e.pointerType === "touch") return;
          const dx = e.clientX - this.lastPtr.x;
          const dy = e.clientY - this.lastPtr.y;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
          this.yaw += dx * 0.0085;
          this.pitch = Math.max(-0.28, Math.min(0.85, this.pitch + dy * 0.0065));
        });
        window.addEventListener("pointerup", () => { this.dragging = false; });

        // Wheel Zoom
        c.addEventListener("wheel", e => {
          e.preventDefault();
          this._userZoomed = true;
          this.camDist = Math.max(2.1, Math.min(7.5, this.camDist + Math.sign(e.deltaY) * 0.24));
        }, { passive: false });

        // Mobile Touch Orbit & 2-Finger Pinch Zoom
        c.addEventListener("touchstart", e => {
          if (e.touches.length === 1) {
            this.dragging = true;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            this.dragging = false;
            this.pinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        c.addEventListener("touchmove", e => {
          e.preventDefault();
          if (e.touches.length === 1 && this.dragging) {
            const dx = e.touches[0].clientX - this.lastPtr.x;
            const dy = e.touches[0].clientY - this.lastPtr.y;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
            this.yaw += dx * 0.011;
            this.pitch = Math.max(-0.28, Math.min(0.85, this.pitch + dy * 0.008));
          } else if (e.touches.length === 2) {
            const nd = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            if (this.pinchDist > 0) {
              this._userZoomed = true;
              this.camDist = Math.max(2.1, Math.min(7.5, this.camDist * (this.pinchDist / nd)));
            }
            this.pinchDist = nd;
          }
        }, { passive: false });

        c.addEventListener("touchend", () => {
          this.dragging = false;
          this.pinchDist = 0;
        }, { passive: true });
      }

      replay() {
        this.timeline = 0.0;
        this.yaw = 0.0;
        this.pitch = 0.16;
        this._userZoomed = false;
        this.camDist = this.baseDist;
      }

      showComplete() {
        this.timeline = 18.0;
      }

      cycleTheme() {
        this.themeIdx = (this.themeIdx + 1) % THEMES.length;
        this.theme = THEMES[this.themeIdx];
        return this.theme.label;
      }

      render(now) {
        const dt = Math.min(0.08, Math.max(0.002, (now - this.lastNow) / 1000));
        this.lastNow = now;
        this.timeline += dt;

        // FPS counter
        this.fpsAcc++;
        if (now - this.fpsTimer >= 400) {
          this.fps = Math.round((this.fpsAcc * 1000) / (now - this.fpsTimer));
          this.fpsAcc = 0;
          this.fpsTimer = now;
        }

        if (this.autoRotate && !this.dragging) {
          this.yaw = (this.yaw + this.rotSpeed * dt) % TAU;
        }

        const cols = this.cols;
        const rows = this.rows;
        const totalCells = cols * rows;
        const zBuf = this.zBuf;
        const chBuf = this.chBuf;
        const rBuf = this.rBuf;
        const gBuf = this.gBuf;
        const bBuf = this.bBuf;
        const glowBuf = this.glowBuf;

        zBuf.fill(1e9);
        chBuf.fill(null);
        glowBuf.fill(0);

        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        // Pitch-black terminal backdrop with faint warm core aura behind tree
        ctx.fillStyle = "#05070c";
        ctx.fillRect(0, 0, this.width, this.height);

        const theme = this.theme;
        const t = this.timeline;

        // 1. Background Twinkling Stars & Gently Drifting Snowflakes
        ctx.font = `${this.fontSize}px 'JetBrains Mono', monospace`;
        ctx.textBaseline = "top";
        const [sr, sg, sb] = theme.sky;

        for (let i = 0; i < this.stars.length; i++) {
          const st = this.stars[i];
          const tw = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.4 + st.phase));
          ctx.fillStyle = `rgba(${sr},${sg},${sb},${tw.toFixed(2)})`;
          ctx.fillText(st.glyph, Math.floor(st.u * cols) * this.cellW, Math.floor(st.v * rows) * this.cellH);
        }

        for (let i = 0; i < this.snow.length; i++) {
          const fl = this.snow[i];
          fl.v = (fl.v + fl.vy * dt) % 1.0;
          fl.u = (fl.u + (fl.vx + Math.sin(t * 0.9 + fl.phase) * 0.012) * dt + 1.0) % 1.0;
          ctx.fillStyle = `rgba(${sr},${sg},${sb},0.72)`;
          ctx.fillText(fl.glyph, Math.floor(fl.u * cols) * this.cellW, Math.floor(fl.v * rows) * this.cellH);
        }

        // 2. Project All 3D Points into Monospace Cell Z-Buffer
        const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
        const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);

        // Directional studio light vector (top-front-right)
        const lx = 0.42, ly = 0.72, lz = 0.55;

        // Fit entire tree (height ~3.1 units) comfortably inside viewport height & width
        const centerY = 1.24;
        const projScale = Math.min(this.width * 0.95, this.height * 0.88) * 1.12;
        const halfW = this.width * 0.5;
        const halfH = this.height * 0.50;

        let activeLights = 0;
        let activeLetters = 0;
        const pts = this.points;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (t < p.t0) continue;

          // Smooth pop-in scale during first 0.35s of appearance
          const grow = Math.min(1.0, (t - p.t0) / 0.35);

          // Rotate around Y (yaw)
          const rx = p.x * cy - p.z * sy;
          const rz0 = p.x * sy + p.z * cy;
          const ry0 = (p.y - centerY) * (p.type === T_GROUND ? 1 : (0.85 + 0.15 * grow));

          // Rotate around X (pitch)
          const ry = ry0 * cp - rz0 * sp;
          const rz = ry0 * sp + rz0 * cp + this.camDist;

          if (rz < 0.35) continue;

          const invZ = projScale / rz;
          const sx = halfW + rx * invZ;
          const sy2 = halfH - ry * invZ;

          const col = Math.floor(sx / this.cellW);
          const row = Math.floor(sy2 / this.cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;

          const cellIdx = row * cols + col;
          if (p.type === T_LIGHT) activeLights++;

          // Z-Buffer depth test (Star & Lights slightly win tie-breakers to stay sparkling)
          const zBias = (p.type === T_LIGHT || p.type === T_STAR || p.type === T_BEAM) ? -0.06 : 0;
          if (rz + zBias >= zBuf[cellIdx]) continue;
          zBuf[cellIdx] = rz + zBias;

          // Rotate normal for 3D directional lighting
          const rnx = p.nx * cy - p.nz * sy;
          const rnz0 = p.nx * sy + p.nz * cy;
          const rny = p.ny * cp - rnz0 * sp;
          const rnz = p.ny * sp + rnz0 * cp;

          const ndl = Math.max(0, rnx * lx + rny * ly + rnz * lz);
          const shade = Math.min(1.28, (0.48 + 0.72 * ndl) * p.ao);

          let r = 200, g = 200, b = 200;
          let glyph = p.glyph;
          let glow = 0;

          if (p.type === T_NEEDLE) {
            const base = theme.foliage[p.cIdx];
            r = base[0] * shade;
            g = base[1] * shade;
            b = base[2] * shade;
            const rampIdx = Math.max(0, Math.min(SHADE_RAMP.length - 1, Math.floor(shade * (SHADE_RAMP.length - 1))));
            if (ndl > 0.65) glyph = SHADE_RAMP[rampIdx];
          } else if (p.type === T_SNOWCAP) {
            const s = 0.72 + 0.35 * ndl;
            r = theme.snow[0] * s; g = theme.snow[1] * s; b = theme.snow[2] * s;
          } else if (p.type === T_TRUNK) {
            r = theme.trunk[0] * shade; g = theme.trunk[1] * shade; b = theme.trunk[2] * shade;
          } else if (p.type === T_GARLAND) {
            const sh = 0.85 + 0.28 * Math.sin(t * 4.0 + p.y * 8.0);
            r = theme.garland[0] * sh; g = theme.garland[1] * sh; b = theme.garland[2] * sh;
            glow = 1;
          } else if (p.type === T_BALL) {
            const bc = theme.balls[p.cIdx];
            const spec = Math.pow(Math.max(0, ndl), 4.0) * 140;
            r = bc[0] * shade + spec;
            g = bc[1] * shade + spec;
            b = bc[2] * shade + spec;
            if (spec > 65) glyph = "*";
            glow = spec > 45 ? 1 : 0;
          } else if (p.type === T_LIGHT) {
            const lc = theme.lights[p.cIdx];
            const pulse = 0.65 + 0.55 * Math.sin(t * 4.8 + p.phase);
            r = lc[0] * pulse; g = lc[1] * pulse; b = lc[2] * pulse;
            glow = pulse > 0.85 ? 2 : 1;
          } else if (p.type === T_STAR || p.type === T_BEAM) {
            const pulse = p.type === T_STAR ? (0.95 + 0.2 * Math.sin(t * 5.0)) : p.ao;
            r = theme.star[0] * pulse; g = theme.star[1] * pulse; b = theme.star[2] * pulse;
            glow = p.type === T_STAR ? 2 : 1;
          } else if (p.type === T_GIFT) {
            const gc = p.customCol;
            const gs = 0.55 + 0.55 * ndl;
            r = gc[0] * gs; g = gc[1] * gs; b = gc[2] * gs;
          } else if (p.type === T_GROUND) {
            const gs = p.ao * 0.72;
            r = theme.ground[0] * gs; g = theme.ground[1] * gs; b = theme.ground[2] * gs;
          }

          chBuf[cellIdx] = glyph;
          rBuf[cellIdx] = Math.min(255, Math.max(0, r));
          gBuf[cellIdx] = Math.min(255, Math.max(0, g));
          bBuf[cellIdx] = Math.min(255, Math.max(0, b));
          glowBuf[cellIdx] = glow;
        }

        // 3. Soft Radiant Glow Halo Behind Star Topper (when star has appeared)
        if (t >= 11.8) {
          const syStar = (2.66 - centerY) * cp - 0 * sp;
          const szStar = (2.66 - centerY) * sp + this.camDist;
          if (szStar > 0.35) {
            const sPx = halfW;
            const sPy = halfH - syStar * (projScale / szStar);
            const rad = Math.min(this.width, this.height) * 0.14;
            const grad = ctx.createRadialGradient(sPx, sPy, 2, sPx, sPy, rad);
            grad.addColorStop(0, `rgba(${theme.star[0]},${theme.star[1]},${theme.star[2]},0.36)`);
            grad.addColorStop(0.45, `rgba(${theme.star[0]},${theme.star[1]},${theme.star[2]},0.10)`);
            grad.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sPx, sPy, rad, 0, TAU);
            ctx.fill();
          }
        }

        // 4. Flush Crisp Monospace Character Buffer to Canvas
        ctx.font = `600 ${this.fontSize}px 'JetBrains Mono', monospace`;
        for (let row = 0; row < rows; row++) {
          const py = row * this.cellH;
          const rowOff = row * cols;
          for (let col = 0; col < cols; col++) {
            const idx = rowOff + col;
            const ch = chBuf[idx];
            if (!ch) continue;
            activeLetters++;
            const r = rBuf[idx], g = gBuf[idx], b = bBuf[idx];
            const gl = glowBuf[idx];
            if (gl > 0) {
              ctx.shadowColor = `rgb(${r},${g},${b})`;
              ctx.shadowBlur = gl === 2 ? 12 : 6;
            } else if (ctx.shadowBlur !== 0) {
              ctx.shadowBlur = 0;
            }
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillText(ch, col * this.cellW, py);
          }
        }
        ctx.shadowBlur = 0;
        ctx.restore();

        // 5. Update Minimal Terminal Telemetry HUD
        const deg = (((this.yaw * 180) / Math.PI) % 360 + 360) % 360;
        this.hud.time.textContent = `t ${t.toFixed(2).padStart(5, "0")}s`;
        this.hud.rot.textContent = `${deg.toFixed(2).padStart(6, "0")}°`;
        this.hud.lights.textContent = activeLights;
        this.hud.letters.textContent = activeLetters.toLocaleString("en-US");
        this.hud.fps.textContent = `${this.fps} fps`;
      }
    }

    // Boot Application
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("ascii-canvas");
      const hud = {
        time: document.getElementById("hud-time"),
        rot: document.getElementById("hud-rot"),
        lights: document.getElementById("hud-lights"),
        letters: document.getElementById("hud-letters"),
        fps: document.getElementById("hud-fps")
      };

      const app = new PureAsciiTreeApp(canvas, hud);
      window.asciiTreeApp = app;

      function loop(now) {
        app.render(now);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // Auto-dim dock for pure cinematic video feel
      const dockWrap = document.getElementById("dock-wrap");
      let idleTimer = null;
      const wake = () => {
        dockWrap.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => dockWrap.classList.add("idle"), 4000);
      };
      window.addEventListener("pointermove", wake);
      window.addEventListener("pointerdown", wake);
      wake();

      // Controls
      document.getElementById("btn-replay").addEventListener("click", () => app.replay());
      document.getElementById("btn-full").addEventListener("click", () => app.showComplete());

      const btnTheme = document.getElementById("btn-theme");
      const themeLbl = document.getElementById("theme-lbl");
      btnTheme.addEventListener("click", () => {
        themeLbl.textContent = app.cycleTheme();
      });

      const btnSpin = document.getElementById("btn-spin");
      btnSpin.addEventListener("click", () => {
        app.autoRotate = !app.autoRotate;
        btnSpin.classList.toggle("active", app.autoRotate);
      });

      const stage = document.getElementById("stage");
      const btnCrt = document.getElementById("btn-crt");
      btnCrt.addEventListener("click", () => {
        stage.classList.toggle("crt");
        btnCrt.classList.toggle("active", stage.classList.contains("crt"));
      });

      document.getElementById("btn-snap").addEventListener("click", () => {
        const a = document.createElement("a");
        a.download = `ascii-christmas-tree-${Date.now()}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      });

      // Music with Web Audio fallback
      const audioEl = document.getElementById("bgMusic");
      const btnAudio = document.getElementById("btn-audio");
      const audioLbl = document.getElementById("audio-lbl");
      let isPlaying = false;
      let synthCtx = null, synthTimer = null;

      function startSynth() {
        if (synthCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        synthCtx = new AC();
        const notes = [659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 659.25, 783.99, 523.25, 587.33, 659.25];
        const durs  = [0.3, 0.3, 0.6, 0.3, 0.3, 0.6, 0.3, 0.3, 0.4, 0.2, 0.8];
        let idx = 0;
        const next = () => {
          if (!synthCtx || synthCtx.state === "closed") return;
          const osc = synthCtx.createOscillator();
          const g = synthCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(notes[idx], synthCtx.currentTime);
          g.gain.setValueAtTime(0.08, synthCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, synthCtx.currentTime + durs[idx] * 0.9);
          osc.connect(g); g.connect(synthCtx.destination);
          osc.start(); osc.stop(synthCtx.currentTime + durs[idx]);
          idx = (idx + 1) % notes.length;
          synthTimer = setTimeout(next, durs[idx] * 1000);
        };
        next();
      }
      function stopSynth() {
        if (synthTimer) clearTimeout(synthTimer);
        if (synthCtx) { synthCtx.close(); synthCtx = null; }
      }

      btnAudio.addEventListener("click", () => {
        if (!isPlaying) {
          audioEl.play().then(() => {
            isPlaying = true;
            btnAudio.classList.add("playing", "active");
            audioLbl.textContent = "⏸ Tắt";
          }).catch(() => {
            startSynth();
            isPlaying = true;
            btnAudio.classList.add("playing", "active");
            audioLbl.textContent = "⏸ Tắt";
          });
        } else {
          audioEl.pause();
          stopSynth();
          isPlaying = false;
          btnAudio.classList.remove("playing", "active");
          audioLbl.textContent = "▶ Nhạc";
        }
      });
    });
  })();
  </script>
</body>
