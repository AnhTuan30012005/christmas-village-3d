<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Christmas City Particle Artwork // Three.js Point Cloud Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010206;
    }
    #city-canvas-container {
      width: 100vw;
      height: calc(100vh - 44px);
      position: relative;
      cursor: grab;
    }
    #city-canvas-container:active {
      cursor: grabbing;
    }
    .particle-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-weight: 700;
      font-size: 0.70rem;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="app-container">
    
    <!-- Top Navigation & Control Bar -->
    <header id="top-bar">
      <div class="brand-section">
        <span class="brand-icon">✨</span>
        <span class="brand-title">CHRISTMAS CITY <span style="color: #8b949e; font-weight: 400;">// PARTICLE & POINT CLOUD ARTWORK</span></span>
        <span class="particle-badge">PURE PARTICLES</span>
      </div>

      <div class="header-actions">
        <!-- Audio Control -->
        <div class="audio-pill" id="audio-pill" title="Bật/Tắt nhạc Giáng sinh">
          <button class="audio-btn" id="btn-audio">▶ Play Sound</button>
          <div class="equalizer" id="equalizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
        </div>

        <!-- Custom Greeting Action -->
        <button class="btn btn-festive" id="btn-open-wish">💌 Lời Chúc</button>
        <a href="index.html" class="btn" style="text-decoration: none;" title="Quay về Làng Giáng Sinh 3D">🏰 Làng 3D</a>
        <a href="ascii.html" class="btn" style="text-decoration: none;" title="Chuyển sang chế độ Terminal ASCII">⚡ Bản ASCII</a>
      </div>
    </header>

    <!-- Master 3D Viewport -->
    <main id="workspace" style="height: calc(100vh - 44px); width: 100%;">
      <div id="city-canvas-container">
        
        <!-- Floating Interactive Toolbar -->
        <div class="floating-dock">
          <button class="dock-btn active" id="btn-cam-photo" title="Đặt lại góc nhìn toàn cảnh chuẩn">
            <span>📷</span> Góc Chuẩn
          </button>
          <div class="dock-divider"></div>
          <button class="dock-btn" id="btn-autorotate" title="Tự động xoay 3D toàn cảnh">
            <span>🔄</span> Tự Xoay 3D
          </button>
          <div class="dock-divider"></div>
          <button class="dock-btn active" id="btn-snow" title="Bật/Tắt tuyết rơi">
            <span>❄️</span> Tuyết: <span id="snow-state">Bật</span>
          </button>
          <div class="dock-divider"></div>
          <button class="dock-btn" id="btn-ascii" title="Chuyển đổi chế độ Hạt Sáng / Ký tự ASCII">
            <span>✨</span> <span id="ascii-state">Hạt Sáng ✨</span>
          </button>
          <div class="dock-divider"></div>
          <button class="dock-btn" id="btn-snapshot" title="Chụp ảnh lưu PNG độ phân giải cao">
            <span>📸</span> Chụp PNG
          </button>
        </div>

        <!-- Festive Wish Banner Overlay -->
        <div id="wish-overlay">
          <div class="wish-text" id="display-wish-title">🎄 MERRY CHRISTMAS 2026 🎄</div>
          <div class="wish-sub" id="display-wish-sub">Chúc bạn một mùa Giáng Sinh an lành & hạnh phúc!</div>
        </div>

      </div>
    </main>

    <!-- Custom Wish Modal Dialog -->
    <div class="modal-backdrop" id="wish-modal">
      <div class="modal-card">
        <h3 class="modal-title">💌 Tùy Chỉnh Lời Chúc Giáng Sinh</h3>
        <div>
          <label style="font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 6px;">Tiêu đề lời chúc:</label>
          <input type="text" id="input-wish-title" class="modal-input" value="MERRY CHRISTMAS 2026">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 6px;">Thông điệp gửi gắm:</label>
          <input type="text" id="input-wish-sub" class="modal-input" value="Chúc bạn một mùa Giáng Sinh ấm áp, bình an và nhiều may mắn!">
        </div>
        <div class="modal-footer">
          <button class="btn" id="btn-close-modal">Hủy</button>
          <button class="btn btn-primary" id="btn-save-wish">Áp Dụng</button>
        </div>
      </div>
    </div>

    <!-- Background Music Audio Element -->
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  </div>

  <!-- Local Three.js and OrbitControls -->
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>

  <!-- Modular Application Entry -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
