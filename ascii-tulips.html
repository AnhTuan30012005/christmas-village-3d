<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>✦ Vườn Hoa Tuylip 3D ASCII · Đêm Ánh Sáng</title>
  <meta name="description" content="Vườn hoa Tuylip và muôn hoa 3D ASCII lung linh trong ánh trăng huyền ảo kèm giai điệu harp êm dịu.">
  <meta property="og:title" content="✦ Vườn Hoa Tuylip 3D ASCII · Đêm Ánh Sáng">
  <meta property="og:description" content="Ngắm vườn hoa Tuylip và muôn hoa 3D ASCII nở rộ lung linh dưới ánh trăng cùng đom đóm và giai điệu dịu êm.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#080614">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #04030c;
      --hud-muted: rgba(235, 224, 248, 0.54);
      --hud-bright: rgba(255, 246, 250, 0.94);
      --rose: #fb7185;
      --gold: #fde68a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--hud-bright);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #170d28 0%, #090616 48%, #030208 100%);
    }

    #ascii-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #ascii-canvas:active { cursor: grabbing; }

    /* Cinematic Opening Veil */
    .intro-curtain {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 46%, rgba(36, 16, 48, 0.94), rgba(6, 4, 14, 0.98));
      transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.15s ease;
      cursor: pointer;
      text-align: center;
      padding: 24px;
    }
    .intro-curtain.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-emblem {
      font-size: 2rem;
      color: #fda4af;
      text-shadow: 0 0 26px rgba(251, 113, 133, 0.85), 0 0 54px rgba(253, 224, 71, 0.45);
      animation: bloomPulse 2.4s ease-in-out infinite;
    }
    .intro-line {
      width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(253, 164, 175, 0.85), rgba(253, 230, 138, 0.85), transparent);
    }
    .intro-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.9rem, 5vw, 3.1rem);
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #fff5f7;
      text-shadow: 0 0 28px rgba(251, 113, 133, 0.48);
    }
    .intro-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(0.98rem, 2.3vw, 1.18rem);
      color: rgba(253, 230, 238, 0.78);
      letter-spacing: 0.05em;
    }
    @keyframes bloomPulse {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      50% { transform: scale(1.14); opacity: 1; }
    }

    /* Ultra-Minimal Top-Left Ghost Controls */
    .mini-controls {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: calc(14px + var(--safe-left));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ghost-btn {
      appearance: none;
      border: 1px solid rgba(253, 164, 175, 0.22);
      background: rgba(14, 10, 24, 0.48);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255, 240, 245, 0.76);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s ease;
    }
    .ghost-btn:hover {
      background: rgba(251, 113, 133, 0.16);
      border-color: rgba(253, 164, 175, 0.55);
      color: #fff1f2;
    }
    .ghost-btn.playing {
      border-color: rgba(253, 224, 71, 0.48);
      color: #fef08a;
      background: rgba(190, 24, 93, 0.18);
    }

    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }
    .eq span {
      width: 2px;
      height: 3px;
      background: currentColor;
      border-radius: 1px;
      opacity: 0.65;
    }
    .ghost-btn.playing .eq span:nth-child(1) { animation: eqBounce 0.72s ease-in-out infinite; }
    .ghost-btn.playing .eq span:nth-child(2) { animation: eqBounce 0.54s ease-in-out 0.15s infinite; }
    .ghost-btn.playing .eq span:nth-child(3) { animation: eqBounce 0.66s ease-in-out 0.3s infinite; }
    @keyframes eqBounce {
      0%, 100% { height: 3px; }
      50% { height: 10px; }
    }

    /* Subtle Terminal Telemetry HUD */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-time {
      position: absolute;
      top: calc(14px + var(--safe-top));
      right: calc(16px + var(--safe-right));
      text-align: right;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #fda4af;
      text-shadow: 0 0 12px rgba(251, 113, 133, 0.55);
    }
    .hud-sub {
      margin-top: 2px;
      font-size: 10.5px;
      color: rgba(253, 230, 138, 0.78);
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.35);
    }
    .hud-bottom-left {
      position: absolute;
      left: calc(14px + var(--safe-left));
      bottom: calc(14px + var(--safe-bottom));
      font-size: 11px;
      line-height: 1.55;
      color: var(--hud-muted);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.88);
    }
    .hud-bottom-left .tag {
      color: rgba(253, 164, 175, 0.85);
      margin-bottom: 1px;
    }
    .hud-bottom-left .val {
      color: var(--hud-bright);
      font-weight: 600;
    }
    .hud-bottom-right {
      position: absolute;
      right: calc(16px + var(--safe-right));
      bottom: calc(14px + var(--safe-bottom));
      font-size: 11px;
      color: var(--hud-muted);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.88);
    }
    .hud-bottom-right .fps {
      color: #86efac;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .hud-bottom-left, .hud-bottom-right { font-size: 10px; }
      .ghost-btn { padding: 5px 9px; font-size: 10.5px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="ascii-canvas"></canvas>

    <!-- Pure Cinematic Veil (No Card / No Letter UI) -->
    <div class="intro-curtain" id="intro-curtain">
      <div class="intro-emblem">✿</div>
      <div class="intro-line"></div>
      <div class="intro-title">NOCTURNE TULIP</div>
      <div class="intro-sub">Khu vườn hoa Tuylip nở rộ dưới ánh trăng huyền ảo...</div>
    </div>

    <!-- Minimal Top-Left Controls (Music + Replay only) -->
    <div class="mini-controls">
      <button class="ghost-btn" id="btn-audio" title="Bật/Tắt nhạc vườn hoa">
        <span id="audio-lbl">▶ Nhạc</span>
        <span class="eq"><span></span><span></span><span></span></span>
      </button>
      <button class="ghost-btn" id="btn-replay" title="Xem hoa nở lại từ đầu">↺</button>
    </div>

    <!-- Minimal Telemetry HUD -->
    <div class="hud">
      <div class="hud-time">
        <div id="hud-time">t 00.00s</div>
        <div class="hud-sub">Moonlit Tulip Garden ✦</div>
      </div>

      <div class="hud-bottom-left">
        <div class="tag">@tulip.nocturne · 3D ASCII</div>
        <div>rotation <span class="val" id="hud-rot">000.00°</span> &nbsp;&nbsp; blooms <span class="val" id="hud-blooms">0</span></div>
        <div>letters <span class="val" id="hud-letters">0</span></div>
      </div>

      <div class="hud-bottom-right">
        blooming · <span class="fps" id="hud-fps">60 fps</span>
      </div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const TAU = Math.PI * 2;

    const T_GROUND   = 0;
    const T_STEM     = 1;
    const T_LEAF     = 2;
    const T_PETAL    = 3;
    const T_STAMEN   = 4;
    const T_DAISY    = 5;
    const T_LAVENDER = 6;
    const T_DEW      = 7;

    // Rich Botanical Tulip Color Themes (base -> mid -> luminous tip)
    const TULIP_THEMES = [
      { base: [182, 18, 66],  mid: [244, 64, 118], tip: [255, 198, 218] }, // Royal Ruby-Rose
      { base: [204, 48, 92],  mid: [255, 118, 162], tip: [255, 224, 236] }, // Sakura Blush Pink
      { base: [212, 74, 42],  mid: [255, 146, 92],  tip: [255, 232, 182] }, // Sunset Coral-Peach
      { base: [214, 142, 18], mid: [255, 206, 66],  tip: [255, 248, 194] }, // Golden Sunbeam
      { base: [128, 56, 198], mid: [188, 116, 255], tip: [240, 214, 255] }, // Twilight Lavender
      { base: [216, 174, 188], mid: [248, 224, 236], tip: [255, 250, 255] }  // Moonlight Pearl
    ];

    // =========================================================================
    // PROCEDURAL AMBIENT HARP & CELESTA NOCTURNE SYNTHESIZER (Zero external MP3 needed!)
    // Romantic Spring Waltz in F Major / D Minor with soft stereo reverb & warm strings
    // =========================================================================
    class GardenMusicEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.convolver = null;
        this.playing = false;
        this.timer = null;
        this.step = 0;

        // 8-Bar Dreamy Spring Progression (Fmaj7 -> Dm9 -> Bbmaj7 -> C9sus4 -> Am7 -> Dm7 -> Gm7 -> C7)
        this.bars = [
          { pad: [174.61, 220.00, 261.63, 329.63], arp: [349.23, 440.00, 523.25, 659.25, 523.25, 698.46, 659.25, 523.25], bell: 880.00 },
          { pad: [146.83, 220.00, 261.63, 329.63], arp: [293.66, 349.23, 440.00, 523.25, 659.25, 523.25, 440.00, 349.23], bell: 783.99 },
          { pad: [116.54, 174.61, 220.00, 293.66], arp: [233.08, 349.23, 440.00, 587.33, 523.25, 440.00, 587.33, 698.46], bell: 880.00 },
          { pad: [130.81, 196.00, 233.08, 293.66], arp: [261.63, 349.23, 392.00, 523.25, 587.33, 523.25, 440.00, 392.00], bell: 1046.50 },
          { pad: [164.81, 220.00, 261.63, 329.63], arp: [329.63, 392.00, 440.00, 523.25, 659.25, 783.99, 659.25, 523.25], bell: 987.77 },
          { pad: [146.83, 174.61, 220.00, 293.66], arp: [293.66, 440.00, 523.25, 587.33, 698.46, 587.33, 523.25, 440.00], bell: 880.00 },
          { pad: [196.00, 233.08, 293.66, 349.23], arp: [392.00, 466.16, 587.33, 698.46, 587.33, 523.25, 466.16, 392.00], bell: 783.99 },
          { pad: [130.81, 196.00, 261.63, 329.63], arp: [261.63, 329.63, 392.00, 523.25, 659.25, 587.33, 523.25, 392.00], bell: 698.46 }
        ];
      }

      initContext() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();

        this.master = this.ctx.createGain();
        this.master.gain.value = 0.0001;

        // Warm Velvet Lowpass Filter
        const lp = this.ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3400;
        lp.Q.value = 0.6;

        // Lush Algorithmic Stereo Reverb Impulse Response
        const sr = this.ctx.sampleRate;
        const len = Math.floor(sr * 2.8);
        const ir = this.ctx.createBuffer(2, len, sr);
        for (let ch = 0; ch < 2; ch++) {
          const data = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) {
            const env = Math.pow(1 - i / len, 2.6);
            data[i] = (Math.random() * 2 - 1) * env * 0.42;
          }
        }
        this.convolver = this.ctx.createConvolver();
        this.convolver.buffer = ir;

        const wet = this.ctx.createGain();
        wet.gain.value = 0.56;
        const dry = this.ctx.createGain();
        dry.gain.value = 0.72;

        this.bus = this.ctx.createGain();
        this.bus.connect(dry);
        this.bus.connect(this.convolver);
        this.convolver.connect(wet);
        dry.connect(lp);
        wet.connect(lp);
        lp.connect(this.master);
        this.master.connect(this.ctx.destination);
      }

      playHarpPluck(freq, time, vel = 0.14) {
        if (!this.ctx) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc1.type = "triangle";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(freq * 2, time);

        const g2 = this.ctx.createGain();
        g2.gain.setValueAtTime(0.22, time);
        g2.gain.exponentialRampToValueAtTime(0.001, time + 0.55);

        g.gain.setValueAtTime(0.0001, time);
        g.gain.linearRampToValueAtTime(vel, time + 0.018);
        g.gain.exponentialRampToValueAtTime(0.0008, time + 2.35);

        osc1.connect(g);
        osc2.connect(g2);
        g2.connect(g);
        g.connect(this.bus);

        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + 2.45);
        osc2.stop(time + 2.45);
      }

      playCelestaBell(freq, time, vel = 0.075) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const og = this.ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        overtone.type = "sine";
        overtone.frequency.setValueAtTime(freq * 3.0, time);
        og.gain.setValueAtTime(0.09, time);
        og.gain.exponentialRampToValueAtTime(0.0005, time + 0.7);

        g.gain.setValueAtTime(0.0001, time);
        g.gain.linearRampToValueAtTime(vel, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0005, time + 2.9);

        osc.connect(g);
        overtone.connect(og);
        og.connect(g);
        g.connect(this.bus);

        osc.start(time);
        overtone.start(time);
        osc.stop(time + 3.0);
        overtone.stop(time + 3.0);
      }

      playWarmPad(notes, time, dur = 3.6) {
        if (!this.ctx) return;
        notes.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, time);
          osc.detune.setValueAtTime((idx % 2 === 0 ? 1 : -1) * 4.5, time);

          g.gain.setValueAtTime(0.0001, time);
          g.gain.linearRampToValueAtTime(0.036, time + 0.95);
          g.gain.setValueAtTime(0.032, time + dur - 0.9);
          g.gain.exponentialRampToValueAtTime(0.0005, time + dur + 0.65);

          osc.connect(g);
          g.connect(this.bus);
          osc.start(time);
          osc.stop(time + dur + 0.75);
        });
      }

      playSparkleChime(pitchBias = 0) {
        if (!this.ctx || !this.playing) return;
        const now = this.ctx.currentTime;
        const pent = [659.25, 698.46, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
        const f = pent[Math.abs(Math.floor(pitchBias * pent.length)) % pent.length];
        this.playCelestaBell(f, now, 0.065);
      }

      tick() {
        if (!this.playing || !this.ctx) return;
        const now = this.ctx.currentTime + 0.05;
        const barIdx = Math.floor(this.step / 8) % this.bars.length;
        const beat = this.step % 8;
        const bar = this.bars[barIdx];

        if (beat === 0) {
          this.playWarmPad(bar.pad, now, 3.55);
          this.playHarpPluck(bar.pad[0], now, 0.14);
        }
        const arpFreq = bar.arp[beat];
        this.playHarpPluck(arpFreq, now, beat === 0 ? 0.15 : (beat % 2 === 0 ? 0.115 : 0.088));

        if (beat === 0 || beat === 4 || (beat === 6 && barIdx % 2 === 1)) {
          const bellFreq = beat === 6 ? bar.bell * 1.122 : bar.bell;
          this.playCelestaBell(bellFreq, now + 0.04, 0.058);
        }
        this.step++;
      }

      async start() {
        this.initContext();
        if (!this.ctx) return false;
        if (this.ctx.state === "suspended") {
          try { await this.ctx.resume(); } catch (_) { return false; }
        }
        if (this.playing) return true;
        this.playing = true;
        const now = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), now);
        this.master.gain.linearRampToValueAtTime(0.88, now + 1.1);

        this.tick();
        this.timer = setInterval(() => this.tick(), 440);
        return true;
      }

      stop() {
        this.playing = false;
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
        if (this.ctx && this.master) {
          const now = this.ctx.currentTime;
          this.master.gain.cancelScheduledValues(now);
          this.master.gain.setValueAtTime(this.master.gain.value, now);
          this.master.gain.linearRampToValueAtTime(0.0001, now + 0.45);
        }
      }
    }

    // =========================================================================
    // 3D Z-BUFFERED MONOSPACE ASCII TULIP & ENCHANTED GARDEN ENGINE
    // =========================================================================
    class RadiantAsciiTulipGarden {
      constructor(canvas, hud, music) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d", { alpha: false });
        this.hud = hud;
        this.music = music;

        this.bloomCanvas = document.createElement("canvas");
        this.bCtx = this.bloomCanvas.getContext("2d");

        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.cols = 120;
        this.rows = 60;
        this.cellW = 6;
        this.cellH = 10;
        this.fontSize = 10;

        this.yaw = 0.0;
        this.pitch = 0.30;
        this.camDist = 4.9;
        this.autoRotate = true;
        this.rotSpeed = 0.28;
        this.introZoomActive = true;

        this.dragging = false;
        this.lastPtr = { x: 0, y: 0 };
        this.ptrDownPos = { x: 0, y: 0 };
        this.pinchDist = 0;

        this.timeline = 0.0;
        this.lastNow = performance.now();
        this.fps = 60;
        this.fpsAcc = 0;
        this.fpsTimer = performance.now();

        this.points = [];
        this.bloomCount = 0;
        this.stars = [];
        this.floatingPetals = [];
        this.fireflies = [];
        this.butterflies = [];
        this.skyGlints = [];
        this.shootingStars = [];
        this.tapSparks = [];

        this.zBuf = null;
        this.chBuf = null;
        this.rBuf = null;
        this.gBuf = null;
        this.bBuf = null;
        this.glowBuf = null;

        this.buildGardenModel();
        this.buildAtmosphere();
        this.resize();
        this.camDist = this.baseDist * 1.42;
        this.bindInput();
      }

      // Build a complete 3D ASCII Tulip with curved stem, broad sweeping leaves, 6 cupped spoon petals & glowing stamen!
      addTulip(cfg, rnd) {
        const {
          bx, bz, height, scale, leanX, leanZ,
          themeIdx, t0, swayPhase, isHero
        } = cfg;
        const theme = TULIP_THEMES[themeIdx % TULIP_THEMES.length];
        this.bloomCount++;

        // Tip of stem (base of flower cup)
        const topX = bx + leanX;
        const topY = height;
        const topZ = bz + leanZ;

        // 1. Graceful S-Curved Stem
        const stemSteps = Math.floor((isHero ? 34 : 22) * (height / 1.4));
        const stemRad = (isHero ? 0.036 : 0.024) * scale;
        const ringN = isHero ? 6 : 4;
        for (let i = 0; i <= stemSteps; i++) {
          const u = i / stemSteps;
          const bend = Math.sin(u * Math.PI) * 0.08 * scale;
          const sx = bx + leanX * u * u + bend * Math.cos(swayPhase);
          const sy = u * topY;
          const sz = bz + leanZ * u * u + bend * Math.sin(swayPhase);
          for (let k = 0; k < ringN; k++) {
            const a = (k / ringN) * TAU;
            this.points.push({
              x: sx + Math.cos(a) * stemRad,
              y: sy,
              z: sz + Math.sin(a) * stemRad,
              nx: Math.cos(a), ny: 0.2, nz: Math.sin(a),
              type: T_STEM,
              t0: t0 + u * 1.1,
              swayPhase,
              swayAmp: u * u * 0.055,
              glyph: u < 0.85 ? "|" : ":"
            });
          }
        }

        // 2. 2–3 Broad Sweeping Lanceolate Tulip Leaves Rising From Base
        const leafCount = isHero ? 3 : 2;
        for (let l = 0; l < leafCount; l++) {
          const la = swayPhase + (l / leafCount) * TAU + 0.5;
          const ca = Math.cos(la), sa = Math.sin(la);
          const tx = -sa, tz = ca;
          const leafH = height * (0.58 + (l % 2) * 0.14);
          const leafReach = (0.34 + (l % 2) * 0.12) * scale;
          const uSteps = isHero ? 20 : 12;
          const wSteps = isHero ? 5 : 3;

          for (let iu = 0; iu <= uSteps; iu++) {
            const u = iu / uSteps;
            const width = Math.sin(u * Math.PI) * 0.115 * scale;
            const reach = Math.pow(u, 0.82) * leafReach;
            const ly = Math.sin(u * Math.PI * 0.62) * leafH;
            for (let iw = -wSteps; iw <= wSteps; iw++) {
              const wf = iw / (wSteps || 1);
              const curl = (1 - wf * wf) * 0.025 * scale;
              const px = bx + ca * (reach + curl) + tx * (wf * width);
              const pz = bz + sa * (reach + curl) + tz * (wf * width);
              this.points.push({
                x: px, y: ly + 0.03, z: pz,
                nx: ca * 0.65, ny: 0.72, nz: sa * 0.65,
                type: T_LEAF,
                u,
                t0: t0 + 0.25 + u * 0.85,
                swayPhase,
                swayAmp: u * u * 0.048,
                glyph: Math.abs(wf) > 0.65 ? "/" : (u > 0.7 ? "^" : "%")
              });
            }
          }
        }

        // 3. 6 Authentic Sculpted Tulip Petals (Elongated Chalice + Distinct Pointed Crown Tips!)
        const cupH = 0.78 * scale;
        const cupR = 0.22 * scale;
        const petalGlyphs = ["@", "#", "%", "*", "+", "✦"];

        for (let pIdx = 0; pIdx < 6; pIdx++) {
          const isOuter = pIdx >= 3;
          const baseAngle = (pIdx % 3) * (TAU / 3) + (isOuter ? Math.PI / 3 : 0) + swayPhase * 0.25;
          const ca = Math.cos(baseAngle), sa = Math.sin(baseAngle);
          const tx = -sa, tz = ca;

          const uSteps = isHero ? 18 : 11;
          const vSteps = isHero ? 6 : 4;
          const flare = isOuter ? 1.16 : 0.88;

          for (let iu = 0; iu <= uSteps; iu++) {
            const u = iu / uSteps; // 0 = cup base, 1 = pointed petal crown tip
            // Classic elongated tulip goblet: rounded belly at u=0.38, gracefully tapered/slight tulip flare at tip!
            const belly = Math.sin(Math.pow(u, 0.72) * Math.PI * 0.82);
            const tipFlare = isOuter && u > 0.72 ? (u - 0.72) * 0.34 : 0;
            const profileR = cupR * flare * (0.12 + 0.92 * belly + tipFlare);

            // Distinct pointed teardrop petal width (wide at belly u=0.45, sharp graceful point at u=1.0 -> iconic tulip crown!)
            const petalW = Math.sin(Math.pow(u, 0.78) * Math.PI) * Math.pow(1 - u * 0.42, 0.45) * 0.175 * scale * (isOuter ? 1.05 : 0.92);
            const tipArch = (isOuter ? 0.96 : 1.06); // Inner petals rise slightly higher into iconic 3-point crown!
            const py = topY + u * cupH * tipArch;

            for (let iv = -vSteps; iv <= vSteps; iv++) {
              const vf = iv / (vSteps || 1);
              const cupBowl = Math.cos(vf * 1.25) * 0.042 * scale;
              const rad = profileR + cupBowl;

              const isEdge = Math.abs(vf) > 0.74 || u > 0.84;
              const px = topX + ca * rad + tx * (vf * petalW);
              const pz = topZ + sa * rad + tz * (vf * petalW);

              let cr, cg, cb;
              if (u < 0.48) {
                const f = u / 0.48;
                cr = theme.base[0] + (theme.mid[0] - theme.base[0]) * f;
                cg = theme.base[1] + (theme.mid[1] - theme.base[1]) * f;
                cb = theme.base[2] + (theme.mid[2] - theme.base[2]) * f;
              } else {
                const f = (u - 0.48) / 0.52;
                cr = theme.mid[0] + (theme.tip[0] - theme.mid[0]) * f;
                cg = theme.mid[1] + (theme.tip[1] - theme.mid[1]) * f;
                cb = theme.mid[2] + (theme.tip[2] - theme.mid[2]) * f;
              }
              if (isEdge) {
                cr = Math.min(255, cr + 34);
                cg = Math.min(255, cg + 30);
                cb = Math.min(255, cb + 34);
              }

              const gIdx = Math.min(petalGlyphs.length - 1, Math.floor(u * 4.4 + (isEdge ? 1 : 0)));
              this.points.push({
                x: px, y: py, z: pz,
                nx: ca * 0.82 + tx * vf * 0.35,
                ny: 0.34 + u * 0.38,
                nz: sa * 0.82 + tz * vf * 0.35,
                type: T_PETAL,
                u,
                isEdge,
                customCol: [cr, cg, cb],
                t0: t0 + 1.05 + u * 1.15 + (isOuter ? 0.25 : 0),
                swayPhase,
                swayAmp: 0.064 * (0.85 + u * 0.35),
                glyph: u > 0.90 && Math.abs(vf) < 0.35 ? "^" : (isEdge && u > 0.82 ? "✦" : petalGlyphs[gIdx])
              });
            }
          }
        }

        // 4. Glowing Golden Stamen & Pollen Crown Deep Inside the Tulip Cup!
        const stamenN = isHero ? 9 : 5;
        for (let s = 0; s < stamenN; s++) {
          const sa = (s / stamenN) * TAU;
          const sr = (s === 0 ? 0 : 0.055 * scale);
          const sh = cupH * (s === 0 ? 0.62 : 0.50);
          for (let fy = 0.14; fy <= 1.0; fy += 0.22) {
            this.points.push({
              x: topX + Math.cos(sa) * sr * fy,
              y: topY + sh * fy,
              z: topZ + Math.sin(sa) * sr * fy,
              nx: 0, ny: 1, nz: 0,
              type: T_STAMEN,
              t0: t0 + 1.9,
              swayPhase,
              swayAmp: 0.072,
              glyph: fy > 0.8 ? "✦" : (fy > 0.5 ? "*" : "|")
            });
          }
        }
      }

      // Build Surrounding Glowing 3D ASCII Daisies / Star-Blossoms
      addDaisy(bx, bz, height, scale, petalCol, t0, swayPhase) {
        this.bloomCount++;
        const leanX = Math.cos(swayPhase) * 0.08;
        const leanZ = Math.sin(swayPhase) * 0.08;
        const topX = bx + leanX, topZ = bz + leanZ;

        // Slender green stem
        for (let i = 0; i <= 12; i++) {
          const u = i / 12;
          this.points.push({
            x: bx + leanX * u, y: u * height, z: bz + leanZ * u,
            nx: 0, ny: 0.5, nz: 0.8,
            type: T_STEM, t0: t0 + u * 0.5, swayPhase, swayAmp: u * u * 0.045,
            glyph: "|"
          });
        }
        // Radiant Golden Disk Center
        for (let c = 0; c < 8; c++) {
          const a = (c / 8) * TAU;
          const r = c === 0 ? 0 : 0.055 * scale;
          this.points.push({
            x: topX + Math.cos(a) * r,
            y: height + 0.03,
            z: topZ + Math.sin(a) * r,
            nx: 0, ny: 1, nz: 0,
            type: T_STAMEN, t0: t0 + 0.7, swayPhase, swayAmp: 0.055,
            glyph: c === 0 ? "☼" : "@"
          });
        }
        // 10 Delicate Star-Spread Petals
        for (let p = 0; p < 10; p++) {
          const a = (p / 10) * TAU + swayPhase;
          const ca = Math.cos(a), sa = Math.sin(a);
          for (let d = 0.07; d <= 0.25; d += 0.045) {
            const r = d * scale;
            const droop = -Math.pow(d / 0.25, 2) * 0.045 * scale;
            this.points.push({
              x: topX + ca * r,
              y: height + 0.02 + droop,
              z: topZ + sa * r,
              nx: ca * 0.3, ny: 0.95, nz: sa * 0.3,
              type: T_DAISY,
              customCol: petalCol,
              t0: t0 + 0.8 + d * 1.4,
              swayPhase, swayAmp: 0.058,
              glyph: d > 0.20 ? "✦" : (d > 0.13 ? "*" : "o")
            });
          }
        }
      }

      // Build Glowing Violet-Blue Lavender & Baby's-Breath Flower Sprigs
      addLavenderSprig(bx, bz, height, col, t0, swayPhase) {
        this.bloomCount++;
        const leanX = Math.cos(swayPhase) * 0.10;
        const leanZ = Math.sin(swayPhase) * 0.10;
        for (let i = 0; i <= 14; i++) {
          const u = i / 14;
          const sx = bx + leanX * u * u;
          const sy = u * height;
          const sz = bz + leanZ * u * u;
          if (u < 0.48) {
            this.points.push({
              x: sx, y: sy, z: sz, nx: 0, ny: 0.5, nz: 0.5,
              type: T_STEM, t0: t0 + u * 0.4, swayPhase, swayAmp: u * u * 0.055, glyph: "|"
            });
          } else {
            for (let b = 0; b < 3; b++) {
              const ba = swayPhase + u * 14 + b * (TAU / 3);
              const br = 0.055 * (1.15 - u * 0.5);
              this.points.push({
                x: sx + Math.cos(ba) * br,
                y: sy,
                z: sz + Math.sin(ba) * br,
                nx: Math.cos(ba), ny: 0.6, nz: Math.sin(ba),
                type: T_LAVENDER,
                customCol: col,
                t0: t0 + 0.5 + u * 0.8,
                swayPhase, swayAmp: u * u * 0.065,
                glyph: u > 0.88 ? "✦" : (b === 0 ? "*" : "o")
              });
            }
          }
        }
      }

      buildGardenModel() {
        this.points = [];
        this.bloomCount = 0;

        let seed = 314159;
        const rnd = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };

        // 1. Enchanted Dewy Moonlit Meadow Floor (Emerald Moss + Sparkling Dewdrops)
        const gSpan = 3.55;
        const gStep = 0.088;
        for (let gx = -gSpan; gx <= gSpan; gx += gStep) {
          for (let gz = -gSpan; gz <= gSpan; gz += gStep) {
            const dist = Math.hypot(gx, gz);
            if (dist > gSpan) continue;
            const waveY = Math.sin(gx * 1.4) * Math.cos(gz * 1.4) * 0.03;
            const isDew = rnd() < 0.042 && dist < 2.8;
            this.points.push({
              x: gx, y: waveY, z: gz,
              nx: 0, ny: 1, nz: 0,
              dist,
              type: isDew ? T_DEW : T_GROUND,
              t0: 0.15 + dist * 0.16,
              swayPhase: gx + gz,
              swayAmp: 0,
              glyph: isDew ? "✦" : (dist < 1.3 ? "~" : (dist < 2.3 ? "-" : "."))
            });
          }
        }

        // 2. HERO CENTERPIECE: 1 Iconic Towering Queen Tulip + 4 Well-Spaced Graceful Flank Tulips (Zero Clumping!)
        const heroTulips = [
          { bx:  0.00, bz:  0.00, height: 1.92, scale: 1.24, leanX:  0.00, leanZ:  0.00, themeIdx: 0, t0: 0.85, swayPhase: 0.2, isHero: true }, // Tall Royal Ruby-Rose Center Queen
          { bx: -0.68, bz:  0.16, height: 1.38, scale: 0.90, leanX: -0.26, leanZ:  0.08, themeIdx: 1, t0: 1.40, swayPhase: 1.4, isHero: true }, // Sakura Blush Pink Left
          { bx:  0.68, bz:  0.14, height: 1.42, scale: 0.92, leanX:  0.26, leanZ:  0.06, themeIdx: 3, t0: 1.65, swayPhase: 2.3, isHero: true }, // Golden Sunbeam Right
          { bx: -0.24, bz: -0.66, height: 1.18, scale: 0.84, leanX: -0.14, leanZ: -0.24, themeIdx: 2, t0: 1.90, swayPhase: 3.1, isHero: true }, // Sunset Coral Front
          { bx:  0.22, bz:  0.68, height: 1.32, scale: 0.86, leanX:  0.12, leanZ:  0.22, themeIdx: 4, t0: 2.15, swayPhase: 4.5, isHero: true }  // Twilight Lavender Back
        ];
        heroTulips.forEach(cfg => this.addTulip(cfg, rnd));

        // 3. SURROUNDING RING 1: 9 Airy Graceful Tulips Encircling the Centerpiece with Breathing Space
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * TAU + 0.34;
          const r = 1.56 + (i % 2) * 0.30;
          const bx = Math.cos(a) * r;
          const bz = Math.sin(a) * r;
          this.addTulip({
            bx, bz,
            height: 0.72 + (i % 3) * 0.14,
            scale: 0.56 + (i % 2) * 0.08,
            leanX: Math.cos(a) * 0.16,
            leanZ: Math.sin(a) * 0.16,
            themeIdx: (i + 1) % TULIP_THEMES.length,
            t0: 3.0 + i * 0.22,
            swayPhase: a * 1.7,
            isHero: false
          }, rnd);
        }

        // 4. SURROUNDING RING 2: 10 Glowing Star-Daisies & Pastel Anemones
        const daisyCols = [
          [255, 246, 250], // Pearl White
          [255, 206, 226], // Soft Rose
          [198, 224, 255], // Sky Forget-Me-Not
          [255, 236, 168]  // Buttercup Cream
        ];
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * TAU + 0.18;
          const r = 1.18 + (i % 2 === 0 ? 0.24 : 0.88);
          this.addDaisy(
            Math.cos(a) * r,
            Math.sin(a) * r,
            0.40 + (i % 3) * 0.12,
            0.76 + (i % 2) * 0.18,
            daisyCols[i % daisyCols.length],
            4.1 + i * 0.18,
            a * 2.1
          );
        }

        // 5. SURROUNDING RING 3: 12 Ethereal Lavender & Baby's-Breath Sprigs Woven Throughout!
        const sprigCols = [
          [192, 132, 252], // Soft Lavender
          [147, 197, 253], // Moonlit Bluebell
          [253, 224, 132], // Golden Baby's Breath
          [251, 146, 184]  // Rose Mist
        ];
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU + 0.52;
          const r = 1.24 + (i % 3) * 0.42;
          this.addLavenderSprig(
            Math.cos(a) * r,
            Math.sin(a) * r,
            0.54 + (i % 3) * 0.14,
            sprigCols[i % sprigCols.length],
            4.7 + i * 0.14,
            a * 1.9
          );
        }
      }

      buildAtmosphere() {
        // Twinkling Night-Garden Sky Stars
        this.stars = [];
        for (let i = 0; i < 190; i++) {
          this.stars.push({
            u: Math.random(),
            v: Math.random() * 0.72,
            phase: Math.random() * TAU,
            warm: i % 3 !== 0,
            glyph: i % 7 === 0 ? "✦" : (i % 4 === 0 ? "*" : "·")
          });
        }

        // 105 Floating Luminous Petals & Moonlit Pollen Drifting Across the Whole Sky
        this.floatingPetals = [];
        const pGlyphs = ["✿", "❀", "✦", "✧", "*", "·"];
        for (let i = 0; i < 105; i++) {
          this.floatingPetals.push({
            u: Math.random(),
            v: Math.random() * 0.92,
            vx: 0.008 + Math.random() * 0.018,
            vy: 0.012 + Math.random() * 0.026,
            phase: Math.random() * TAU,
            speed: 1.4 + Math.random() * 2.4,
            col: i % 3 === 0 ? [255, 178, 206] : (i % 3 === 1 ? [255, 232, 152] : [214, 186, 255]),
            bright: i % 4 === 0,
            glyph: pGlyphs[i % pGlyphs.length]
          });
        }

        // 28 3D Glowing Golden Fireflies (Đom đóm) Weaving Through the Tulips!
        this.fireflies = [];
        for (let i = 0; i < 28; i++) {
          this.fireflies.push({
            angle: Math.random() * TAU,
            radius: 0.45 + Math.random() * 1.95,
            yBase: 0.35 + Math.random() * 1.85,
            speedA: (i % 2 === 0 ? 1 : -1) * (0.22 + Math.random() * 0.35),
            phase: Math.random() * TAU,
            warm: i % 4 !== 0
          });
        }

        // 3 Delicate Glowing 3D ASCII Butterflies Fluttering Around the Hero Tulips
        this.butterflies = [
          { angle: 0.4, radius: 0.85, yBase: 1.92, speed: 0.42, phase: 0.0, col: [255, 214, 118] },
          { angle: 2.5, radius: 1.22, yBase: 1.56, speed: -0.36, phase: 2.1, col: [255, 168, 214] },
          { angle: 4.4, radius: 1.05, yBase: 1.74, speed: 0.32, phase: 4.2, col: [176, 228, 255] }
        ];

        // 16 Wide-Sky Diamond Starburst Glints
        this.skyGlints = [];
        for (let i = 0; i < 16; i++) {
          const u = (i % 2 === 0) ? (0.04 + Math.random() * 0.34) : (0.62 + Math.random() * 0.34);
          const v = 0.05 + Math.random() * 0.58;
          this.skyGlints.push({
            u, v,
            phase: Math.random() * TAU,
            speed: 1.2 + Math.random() * 1.8,
            size: 10 + Math.random() * 13,
            rose: i % 3 === 0
          });
        }

        // 2 Gentle Moonlit Shooting Stars
        this.shootingStars = [
          { x: 0.12, y: 0.09, vx: 0.32, vy: 0.14, delay: 0.8, dur: 1.35, cooldown: 5.5 },
          { x: 0.84, y: 0.07, vx: -0.30, vy: 0.15, delay: 3.9, dur: 1.25, cooldown: 6.4 }
        ];
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);

        this.bloomScale = 0.28;
        this.bloomCanvas.width = Math.max(1, Math.floor(this.width * this.bloomScale));
        this.bloomCanvas.height = Math.max(1, Math.floor(this.height * this.bloomScale));

        const minDim = Math.min(this.width, this.height);
        if (this.width < 520) {
          this.fontSize = Math.max(6.2, Math.min(8.0, this.width / 52));
        } else if (this.width < 900) {
          this.fontSize = Math.max(7.6, Math.min(9.4, minDim / 82));
        } else {
          this.fontSize = Math.max(8.6, Math.min(10.6, minDim / 86));
        }

        this.cellW = this.fontSize * 0.60;
        this.cellH = this.fontSize * 1.04;
        this.cols = Math.max(56, Math.floor(this.width / this.cellW));
        this.rows = Math.max(42, Math.floor(this.height / this.cellH));

        const total = this.cols * this.rows;
        this.zBuf = new Float32Array(total);
        this.chBuf = new Array(total);
        this.rBuf = new Uint8Array(total);
        this.gBuf = new Uint8Array(total);
        this.bBuf = new Uint8Array(total);
        this.glowBuf = new Uint8Array(total);

        const aspect = this.width / Math.max(1, this.height);
        this.baseDist = aspect < 0.75 ? 4.85 : (aspect < 1.1 ? 4.45 : 4.25);
        if (!this._userZoomed && !this.introZoomActive) this.camDist = this.baseDist;
      }

      bindInput() {
        window.addEventListener("resize", () => this.resize());
        const c = this.canvas;

        c.addEventListener("pointerdown", e => {
          if (e.pointerType === "touch") return;
          this.dragging = true;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
          this.ptrDownPos.x = e.clientX;
          this.ptrDownPos.y = e.clientY;
        });
        window.addEventListener("pointermove", e => {
          if (!this.dragging || e.pointerType === "touch") return;
          const dx = e.clientX - this.lastPtr.x;
          const dy = e.clientY - this.lastPtr.y;
          this.lastPtr.x = e.clientX;
          this.lastPtr.y = e.clientY;
          this.yaw += dx * 0.0085;
          this.pitch = Math.max(-0.18, Math.min(0.88, this.pitch + dy * 0.0065));
        });
        window.addEventListener("pointerup", e => {
          if (this.dragging && e.pointerType !== "touch") {
            const moved = Math.hypot(e.clientX - this.ptrDownPos.x, e.clientY - this.ptrDownPos.y);
            if (moved < 7) this.spawnPetalBurst(e.clientX, e.clientY);
          }
          this.dragging = false;
        });

        c.addEventListener("wheel", e => {
          e.preventDefault();
          this._userZoomed = true;
          this.introZoomActive = false;
          this.camDist = Math.max(2.1, Math.min(7.0, this.camDist + Math.sign(e.deltaY) * 0.22));
        }, { passive: false });

        c.addEventListener("touchstart", e => {
          if (e.touches.length === 1) {
            this.dragging = true;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
            this.ptrDownPos.x = e.touches[0].clientX;
            this.ptrDownPos.y = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            this.dragging = false;
            this.pinchDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        c.addEventListener("touchmove", e => {
          e.preventDefault();
          if (e.touches.length === 1 && this.dragging) {
            const dx = e.touches[0].clientX - this.lastPtr.x;
            const dy = e.touches[0].clientY - this.lastPtr.y;
            this.lastPtr.x = e.touches[0].clientX;
            this.lastPtr.y = e.touches[0].clientY;
            this.yaw += dx * 0.011;
            this.pitch = Math.max(-0.18, Math.min(0.88, this.pitch + dy * 0.008));
          } else if (e.touches.length === 2) {
            const nd = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            if (this.pinchDist > 0) {
              this._userZoomed = true;
              this.introZoomActive = false;
              this.camDist = Math.max(2.1, Math.min(7.0, this.camDist * (this.pinchDist / nd)));
            }
            this.pinchDist = nd;
          }
        }, { passive: false });

        c.addEventListener("touchend", e => {
          if (this.dragging && e.changedTouches && e.changedTouches.length === 1) {
            const tEnd = e.changedTouches[0];
            const moved = Math.hypot(tEnd.clientX - this.ptrDownPos.x, tEnd.clientY - this.ptrDownPos.y);
            if (moved < 10) this.spawnPetalBurst(tEnd.clientX, tEnd.clientY);
          }
          this.dragging = false;
          this.pinchDist = 0;
        }, { passive: true });
      }

      spawnPetalBurst(x, y) {
        const cols = [[255, 134, 174], [255, 224, 118], [218, 168, 255], [255, 198, 224], [176, 232, 255]];
        const glyphs = ["✿", "✦", "✧", "*", "·"];
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * TAU + (Math.random() - 0.5) * 0.35;
          const spd = 44 + Math.random() * 105;
          this.tapSparks.push({
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - 26,
            life: 1.0,
            decay: 0.85 + Math.random() * 0.5,
            col: cols[i % cols.length],
            glyph: glyphs[i % glyphs.length],
            flare: i % 5 === 0
          });
        }
        if (this.tapSparks.length > 140) this.tapSparks.splice(0, this.tapSparks.length - 140);
        if (this.music) this.music.playSparkleChime(x / Math.max(1, this.width));
      }

      replay() {
        this.timeline = 0.0;
        this.yaw = 0.0;
        this.pitch = 0.30;
        this._userZoomed = false;
        this.introZoomActive = true;
        this.camDist = this.baseDist * 1.42;
      }

      showComplete() {
        this.timeline = 10.5;
        this.introZoomActive = false;
        this.camDist = this.baseDist;
      }

      drawLensFlare(ctx, x, y, radius, r, g, b, alpha) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const gr = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gr.addColorStop(0, `rgba(255,252,248,${(alpha * 0.92).toFixed(2)})`);
        gr.addColorStop(0.28, `rgba(${r},${g},${b},${(alpha * 0.55).toFixed(2)})`);
        gr.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = `rgba(255,248,244,${(alpha * 0.80).toFixed(2)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x - radius * 0.92, y);
        ctx.lineTo(x + radius * 0.92, y);
        ctx.moveTo(x, y - radius * 0.92);
        ctx.lineTo(x, y + radius * 0.92);
        ctx.stroke();
        ctx.restore();
      }

      render(now) {
        const dt = Math.min(0.08, Math.max(0.002, (now - this.lastNow) / 1000));
        this.lastNow = now;
        this.timeline += dt;

        if (this.introZoomActive) {
          this.camDist += (this.baseDist - this.camDist) * (1 - Math.exp(-1.45 * dt));
          if (Math.abs(this.camDist - this.baseDist) < 0.02) {
            this.camDist = this.baseDist;
            this.introZoomActive = false;
          }
        }

        this.fpsAcc++;
        if (now - this.fpsTimer >= 400) {
          this.fps = Math.round((this.fpsAcc * 1000) / (now - this.fpsTimer));
          this.fpsAcc = 0;
          this.fpsTimer = now;
        }

        if (this.autoRotate && !this.dragging) {
          this.yaw = (this.yaw + this.rotSpeed * dt) % TAU;
        }

        const cols = this.cols;
        const rows = this.rows;
        const zBuf = this.zBuf;
        const chBuf = this.chBuf;
        const rBuf = this.rBuf;
        const gBuf = this.gBuf;
        const bBuf = this.bBuf;
        const glowBuf = this.glowBuf;

        zBuf.fill(1e9);
        chBuf.fill(null);
        glowBuf.fill(0);

        const ctx = this.ctx;
        const bCtx = this.bCtx;
        const t = this.timeline;

        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        // 1. Deep Moonlit Twilight Sky Gradient
        const bgGrad = ctx.createRadialGradient(
          this.width * 0.5, this.height * 0.44, 16,
          this.width * 0.5, this.height * 0.48, Math.max(this.width, this.height) * 0.72
        );
        bgGrad.addColorStop(0.0, "#1c1030");
        bgGrad.addColorStop(0.42, "#0c071c");
        bgGrad.addColorStop(1.0, "#030208");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        // 2. Ethereal Moonlit Zenith Glow + Soft Pastel-Gold & Rose Heavenly Light Rays
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const skyFade = Math.min(1.0, t / 2.8);
        const zenithX = this.width * 0.5;
        const zenithY = -this.height * 0.06;

        const zRad = Math.max(this.width, this.height) * 0.62;
        const zGrad = ctx.createRadialGradient(zenithX, zenithY, 8, zenithX, zenithY, zRad);
        zGrad.addColorStop(0.0, `rgba(255, 240, 224, ${(0.20 * skyFade).toFixed(3)})`);
        zGrad.addColorStop(0.26, `rgba(251, 146, 184, ${(0.095 * skyFade).toFixed(3)})`);
        zGrad.addColorStop(0.58, `rgba(139, 92, 246, ${(0.055 * skyFade).toFixed(3)})`);
        zGrad.addColorStop(1.0, "rgba(0,0,0,0)");
        ctx.fillStyle = zGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        const rayCount = 9;
        const rayLen = Math.hypot(this.width, this.height) * 0.94;
        for (let rIdx = 0; rIdx < rayCount; rIdx++) {
          const frac = (rIdx / (rayCount - 1)) - 0.5;
          const angle = Math.PI * 0.5 + frac * 1.42 + Math.sin(t * 0.32 + rIdx * 1.2) * 0.04;
          const halfSpread = 0.028 + (rIdx % 3) * 0.012;
          const breathe = (0.50 + 0.50 * Math.sin(t * (0.65 + (rIdx % 3) * 0.2) + rIdx * 1.5)) * skyFade;
          const alpha = (Math.abs(frac) < 0.25 ? 0.064 : 0.044) * breathe;

          const rGrad = ctx.createLinearGradient(
            zenithX, zenithY,
            zenithX + Math.cos(angle) * rayLen * 0.80,
            zenithY + Math.sin(angle) * rayLen * 0.80
          );
          rGrad.addColorStop(0.0, `rgba(255, 244, 226, ${(alpha * 1.4).toFixed(3)})`);
          rGrad.addColorStop(0.36, `rgba(253, 186, 206, ${(alpha * 0.92).toFixed(3)})`);
          rGrad.addColorStop(0.70, `rgba(196, 181, 253, ${(alpha * 0.35).toFixed(3)})`);
          rGrad.addColorStop(1.0, "rgba(0,0,0,0)");

          ctx.fillStyle = rGrad;
          ctx.beginPath();
          ctx.moveTo(zenithX, zenithY);
          ctx.lineTo(zenithX + Math.cos(angle - halfSpread) * rayLen, zenithY + Math.sin(angle - halfSpread) * rayLen);
          ctx.lineTo(zenithX + Math.cos(angle + halfSpread) * rayLen, zenithY + Math.sin(angle + halfSpread) * rayLen);
          ctx.closePath();
          ctx.fill();
        }

        // Soft Dreamy Rose-Lavender & Champagne Aurora Veil
        for (let band = 0; band < 2; band++) {
          const yCenter = this.height * (0.18 + band * 0.09);
          const ribbonH = this.height * 0.16;
          const vGrad = ctx.createLinearGradient(0, yCenter - ribbonH, 0, yCenter + ribbonH);
          if (band === 0) {
            vGrad.addColorStop(0.0, "rgba(251, 113, 133, 0)");
            vGrad.addColorStop(0.40, `rgba(251, 146, 184, ${(0.055 * skyFade).toFixed(3)})`);
            vGrad.addColorStop(0.68, `rgba(253, 224, 132, ${(0.046 * skyFade).toFixed(3)})`);
            vGrad.addColorStop(1.0, "rgba(253, 224, 132, 0)");
          } else {
            vGrad.addColorStop(0.0, "rgba(167, 139, 250, 0)");
            vGrad.addColorStop(0.45, `rgba(192, 132, 252, ${(0.052 * skyFade).toFixed(3)})`);
            vGrad.addColorStop(0.75, `rgba(125, 211, 252, ${(0.040 * skyFade).toFixed(3)})`);
            vGrad.addColorStop(1.0, "rgba(125, 211, 252, 0)");
          }
          ctx.fillStyle = vGrad;
          ctx.beginPath();
          const stepX = Math.max(24, this.width / 24);
          for (let sx = 0; sx <= this.width + stepX; sx += stepX) {
            const wave = Math.sin(sx * 0.004 + t * (0.36 + band * 0.14) + band * 2.1) * 22;
            const py = yCenter - ribbonH * 0.55 + wave;
            if (sx === 0) ctx.moveTo(sx, py);
            else ctx.lineTo(sx, py);
          }
          for (let sx = this.width + stepX; sx >= 0; sx -= stepX) {
            const wave = Math.sin(sx * 0.004 + t * (0.36 + band * 0.14) + band * 2.1) * 16;
            ctx.lineTo(sx, yCenter + ribbonH * 0.85 + wave);
          }
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        bCtx.clearRect(0, 0, this.bloomCanvas.width, this.bloomCanvas.height);

        const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
        const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
        const lx = 0.38, ly = 0.80, lz = -0.46;

        const centerY = 1.16;
        const projScale = Math.min(this.width * 0.96, this.height * 0.88) * 1.14;
        const halfW = this.width * 0.5;
        const halfH = this.height * 0.55;

        // Warm Luminous Rose-Gold Floral Aura behind the Tulip Bouquet
        const auraStrength = Math.min(1.0, t / 5.0);
        if (auraStrength > 0.05) {
          const coreRad = Math.min(this.width, this.height) * 0.42;
          const coreGrad = ctx.createRadialGradient(halfW, halfH - 22, 8, halfW, halfH - 22, coreRad);
          coreGrad.addColorStop(0.0, `rgba(255, 138, 178, ${(0.15 * auraStrength).toFixed(3)})`);
          coreGrad.addColorStop(0.45, `rgba(253, 212, 118, ${(0.075 * auraStrength).toFixed(3)})`);
          coreGrad.addColorStop(1.0, "rgba(0,0,0,0)");
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(halfW, halfH - 22, coreRad, 0, TAU);
          ctx.fill();
        }

        // 3. Twinkling Night Stars
        ctx.font = `${this.fontSize}px 'JetBrains Mono', monospace`;
        ctx.textBaseline = "top";
        for (let i = 0; i < this.stars.length; i++) {
          const st = this.stars[i];
          const tw = 0.22 + 0.68 * (0.5 + 0.5 * Math.sin(t * 2.5 + st.phase));
          ctx.fillStyle = st.warm
            ? `rgba(255, 232, 186, ${tw.toFixed(2)})`
            : `rgba(216, 206, 255, ${tw.toFixed(2)})`;
          ctx.fillText(st.glyph, Math.floor(st.u * cols) * this.cellW, Math.floor(st.v * rows) * this.cellH);
        }

        // 4. Project All 3D ASCII Garden Points with Organic Gentle Wind Sway!
        let activeLetters = 0;
        const pts = this.points;
        const windTime = t * 1.35;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (t < p.t0) continue;

          const grow = Math.min(1.0, (t - p.t0) / 0.42);
          const sway = p.swayAmp > 0 ? Math.sin(windTime + p.swayPhase) * p.swayAmp : 0;
          const wx = p.x + sway;
          const wz = p.z + sway * 0.45;
          const wy = p.type === T_GROUND || p.type === T_DEW ? p.y : p.y * (0.72 + 0.28 * grow);

          const rx = wx * cy - wz * sy;
          const rz0 = wx * sy + wz * cy;
          const ry0 = wy - centerY;
          const ry = ry0 * cp - rz0 * sp;
          const rz = ry0 * sp + rz0 * cp + this.camDist;
          if (rz < 0.35) continue;

          const invZ = projScale / rz;
          const sx = halfW + rx * invZ;
          const sy2 = halfH - ry * invZ;

          const col = Math.floor(sx / this.cellW);
          const row = Math.floor(sy2 / this.cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;

          const cellIdx = row * cols + col;
          const zBias = (p.type === T_STAMEN || p.type === T_PETAL || p.type === T_DAISY) ? -0.04 : 0;
          if (rz + zBias >= zBuf[cellIdx]) continue;
          zBuf[cellIdx] = rz + zBias;

          const rnx = p.nx * cy - p.nz * sy;
          const rnz0 = p.nx * sy + p.nz * cy;
          const rny = p.ny * cp - rnz0 * sp;
          const rnz = p.ny * sp + rnz0 * cp;
          const ndl = Math.max(0, rnx * lx + rny * ly + rnz * lz);
          const shade = 0.56 + 0.62 * ndl;

          let r = 200, g = 200, b = 200;
          let glow = 0;
          const glyph = p.glyph;

          if (p.type === T_GROUND) {
            const falloff = Math.max(0.18, 1.0 - Math.pow(p.dist / 3.55, 1.55) * 0.78);
            const warmBloom = p.dist < 1.65 ? (1 - p.dist / 1.65) * 0.38 * auraStrength : 0;
            r = 46 * falloff + 245 * warmBloom;
            g = 118 * falloff + 122 * warmBloom;
            b = 88 * falloff + 158 * warmBloom;
          } else if (p.type === T_DEW) {
            const tw = 0.55 + 0.45 * Math.sin(t * 4.0 + p.swayPhase * 3.0);
            r = 255 * tw; g = 236 * tw; b = 188 * tw;
            glow = tw > 0.78 ? 2 : 1;
          } else if (p.type === T_STEM) {
            r = 38 * shade; g = 168 * shade; b = 82 * shade;
          } else if (p.type === T_LEAF) {
            const tipLit = 0.78 + p.u * 0.42;
            r = 44 * shade * tipLit; g = 192 * shade * tipLit; b = 104 * shade * tipLit;
            if (p.u > 0.78) glow = 1;
          } else if (p.type === T_PETAL) {
            const pulse = 0.92 + 0.14 * Math.sin(t * 2.4 + p.swayPhase + p.u * 3.0);
            const ps = (0.68 + 0.48 * ndl) * pulse;
            r = p.customCol[0] * ps;
            g = p.customCol[1] * ps;
            b = p.customCol[2] * ps;
            glow = (p.isEdge && p.u > 0.62) ? 2 : (p.u > 0.45 ? 1 : 0);
          } else if (p.type === T_STAMEN) {
            const pulse = 0.92 + 0.24 * Math.sin(t * 5.2 + p.swayPhase);
            r = 255 * pulse; g = 224 * pulse; b = 92 * pulse;
            glow = 2;
          } else if (p.type === T_DAISY) {
            const ps = 0.76 + 0.38 * ndl;
            r = p.customCol[0] * ps; g = p.customCol[1] * ps; b = p.customCol[2] * ps;
            glow = 1;
          } else if (p.type === T_LAVENDER) {
            const ps = 0.78 + 0.36 * ndl;
            r = p.customCol[0] * ps; g = p.customCol[1] * ps; b = p.customCol[2] * ps;
            glow = glyph === "✦" ? 2 : 1;
          }

          chBuf[cellIdx] = glyph;
          rBuf[cellIdx] = Math.min(255, Math.max(0, r));
          gBuf[cellIdx] = Math.min(255, Math.max(0, g));
          bBuf[cellIdx] = Math.min(255, Math.max(0, b));
          glowBuf[cellIdx] = glow;
        }

        // Dynamic Z-Buffer Plotter for 3D Butterflies & Fireflies
        const plotDyn = (wx, wy, wz, glyph, rr, gg, bb, gl = 1, zBias = -0.06) => {
          const rx = wx * cy - wz * sy;
          const rz0 = wx * sy + wz * cy;
          const ry0 = wy - centerY;
          const ry = ry0 * cp - rz0 * sp;
          const rz = ry0 * sp + rz0 * cp + this.camDist;
          if (rz < 0.35) return null;
          const invZ = projScale / rz;
          const sx = halfW + rx * invZ;
          const sy2 = halfH - ry * invZ;
          const col = Math.floor(sx / this.cellW);
          const row = Math.floor(sy2 / this.cellH);
          if (col < 0 || col >= cols || row < 0 || row >= rows) return null;
          const cellIdx = row * cols + col;
          if (rz + zBias < zBuf[cellIdx]) {
            zBuf[cellIdx] = rz + zBias;
            chBuf[cellIdx] = glyph;
            rBuf[cellIdx] = Math.min(255, Math.max(0, rr));
            gBuf[cellIdx] = Math.min(255, Math.max(0, gg));
            bBuf[cellIdx] = Math.min(255, Math.max(0, bb));
            glowBuf[cellIdx] = gl;
          }
          return { sx, sy: sy2, rz };
        };

        // 4B. 3 Delicate Luminous 3D ASCII Butterflies Fluttering Around the Tulips!
        const butterflyFlares = [];
        if (t >= 2.2) {
          const bFade = Math.min(1, (t - 2.2) / 1.2);
          for (let i = 0; i < this.butterflies.length; i++) {
            const bf = this.butterflies[i];
            bf.angle = (bf.angle + bf.speed * dt) % TAU;
            const bx = Math.cos(bf.angle) * bf.radius;
            const bz = Math.sin(bf.angle) * bf.radius;
            const by = bf.yBase + Math.sin(t * 2.6 + bf.phase) * 0.22;
            const flap = Math.sin(t * 14.0 + bf.phase) > 0;
            const wingL = flap ? "(" : "<";
            const wingR = flap ? ")" : ">";
            const [cr, cg, cb] = bf.col;
            const center = plotDyn(bx, by, bz, "✦", 255 * bFade, 248 * bFade, 210 * bFade, 2, -0.09);
            plotDyn(bx - 0.09, by + (flap ? 0.04 : -0.02), bz, wingL, cr * bFade, cg * bFade, cb * bFade, 2, -0.08);
            plotDyn(bx + 0.09, by + (flap ? 0.04 : -0.02), bz, wingR, cr * bFade, cg * bFade, cb * bFade, 2, -0.08);
            if (center) butterflyFlares.push({ sx: center.sx, sy: center.sy, col: bf.col, a: bFade });
          }
        }

        // 4C. 28 Glowing 3D Fireflies Weaving Through the Tulips & Blossoms
        const fireflyFlares = [];
        if (t >= 1.6) {
          const fFade = Math.min(1, (t - 1.6) / 1.5);
          for (let i = 0; i < this.fireflies.length; i++) {
            const ff = this.fireflies[i];
            ff.angle = (ff.angle + ff.speedA * dt) % TAU;
            const fx = Math.cos(ff.angle) * ff.radius + Math.sin(t * 0.9 + ff.phase) * 0.14;
            const fz = Math.sin(ff.angle) * ff.radius + Math.cos(t * 0.8 + ff.phase) * 0.14;
            const fy = ff.yBase + Math.sin(t * 1.9 + ff.phase) * 0.26;
            const glowPulse = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 3.8 + ff.phase))) * fFade;
            const col = ff.warm ? [255, 228, 108] : [255, 162, 214];
            const res = plotDyn(fx, fy, fz, glowPulse > 0.72 ? "✦" : "·", col[0] * glowPulse, col[1] * glowPulse, col[2] * glowPulse, 2, -0.08);
            if (res && glowPulse > 0.68) {
              fireflyFlares.push({ sx: res.sx, sy: res.sy, col, a: glowPulse });
            }
          }
        }

        // 5. Flush Z-Buffered Monospace Characters + Bloom Buffer
        ctx.font = `600 ${this.fontSize}px 'JetBrains Mono', monospace`;
        bCtx.font = `700 ${this.fontSize * this.bloomScale}px 'JetBrains Mono', monospace`;
        bCtx.textBaseline = "top";
        const bs = this.bloomScale;

        for (let row = 0; row < rows; row++) {
          const py = row * this.cellH;
          const bpy = py * bs;
          const rowOff = row * cols;
          for (let col = 0; col < cols; col++) {
            const idx = rowOff + col;
            const ch = chBuf[idx];
            if (!ch) continue;
            activeLetters++;
            const r = rBuf[idx], g = gBuf[idx], b = bBuf[idx];
            const px = col * this.cellW;
            const rgb = `rgb(${r},${g},${b})`;
            ctx.fillStyle = rgb;
            ctx.fillText(ch, px, py);

            const gl = glowBuf[idx];
            if (gl > 0) {
              bCtx.fillStyle = rgb;
              bCtx.fillText(ch, px * bs, bpy);
              if (gl === 2) bCtx.fillText(ch, px * bs, bpy);
            }
          }
        }

        // 6. Wide-Sky Floating Luminous Petals & Moonlit Pollen
        const petalAlpha = Math.min(1.0, t / 2.2);
        for (let i = 0; i < this.floatingPetals.length; i++) {
          const fp = this.floatingPetals[i];
          fp.v = (fp.v + fp.vy * dt) % 0.94;
          fp.u = (fp.u + (fp.vx + Math.sin(t * 0.7 + fp.phase) * 0.008) * dt + 1.0) % 1.0;
          const tw = (0.32 + 0.68 * (0.5 + 0.5 * Math.sin(t * fp.speed + fp.phase))) * petalAlpha;
          if (tw < 0.14) continue;
          const px = fp.u * this.width;
          const py = fp.v * this.height;
          const colStr = `rgba(${fp.col[0]},${fp.col[1]},${fp.col[2]},${(tw * 0.88).toFixed(2)})`;
          ctx.fillStyle = colStr;
          ctx.fillText(fp.glyph, px, py);
          if (fp.bright || tw > 0.74) {
            bCtx.fillStyle = colStr;
            bCtx.fillText(fp.glyph, px * bs, py * bs);
          }
        }

        // 7. Composite Dual-Pass Optical Bloom
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.filter = "blur(4px)";
        ctx.globalAlpha = 0.90;
        ctx.drawImage(this.bloomCanvas, 0, 0, this.width, this.height);

        ctx.filter = "blur(10px)";
        ctx.globalAlpha = 0.56;
        ctx.drawImage(this.bloomCanvas, 0, 0, this.width, this.height);
        ctx.restore();

        // 8. Optical Starburst Glints (Fireflies + Butterflies + Wide-Sky Twinkles + Shooting Stars)
        for (let i = 0; i < fireflyFlares.length; i++) {
          const ff = fireflyFlares[i];
          this.drawLensFlare(ctx, ff.sx, ff.sy, 11 + ff.a * 7, ff.col[0], ff.col[1], ff.col[2], ff.a * 0.68);
        }
        for (let i = 0; i < butterflyFlares.length; i++) {
          const bf = butterflyFlares[i];
          this.drawLensFlare(ctx, bf.sx, bf.sy, 15, bf.col[0], bf.col[1], bf.col[2], bf.a * 0.70);
        }

        for (let i = 0; i < this.skyGlints.length; i++) {
          const sg = this.skyGlints[i];
          const wave = Math.sin(t * sg.speed + sg.phase);
          if (wave < 0.28) continue;
          const intensity = ((wave - 0.28) / 0.72) * skyFade;
          const gx = sg.u * this.width;
          const gy = sg.v * this.height;
          if (sg.rose) {
            this.drawLensFlare(ctx, gx, gy, sg.size * (0.65 + 0.55 * intensity), 255, 168, 206, intensity * 0.75);
          } else {
            this.drawLensFlare(ctx, gx, gy, sg.size * (0.65 + 0.55 * intensity), 255, 228, 132, intensity * 0.75);
          }
        }

        // Moonlit Shooting Stars
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < this.shootingStars.length; i++) {
          const ss = this.shootingStars[i];
          const cycle = ss.dur + ss.cooldown;
          const localT = (t + ss.delay) % cycle;
          if (localT > ss.dur) continue;
          const p = localT / ss.dur;
          const alpha = Math.sin(p * Math.PI);
          const hx = (ss.x + ss.vx * p) * this.width;
          const hy = (ss.y + ss.vy * p) * this.height;
          const tx = (ss.x + ss.vx * Math.max(0, p - 0.13)) * this.width;
          const ty = (ss.y + ss.vy * Math.max(0, p - 0.13)) * this.height;

          const grad = ctx.createLinearGradient(tx, ty, hx, hy);
          grad.addColorStop(0.0, "rgba(255, 214, 232, 0)");
          grad.addColorStop(0.65, `rgba(255, 228, 196, ${(alpha * 0.52).toFixed(2)})`);
          grad.addColorStop(1.0, `rgba(255, 255, 250, ${(alpha * 0.94).toFixed(2)})`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.9;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(hx, hy);
          ctx.stroke();

          this.drawLensFlare(ctx, hx, hy, 12 * alpha, 255, 220, 196, alpha * 0.84);
        }
        ctx.restore();

        // 9. Interactive Tap/Click Petal & Stardust Bursts
        if (this.tapSparks.length) {
          ctx.font = `700 ${Math.max(11, this.fontSize + 2)}px 'JetBrains Mono', monospace`;
          for (let i = this.tapSparks.length - 1; i >= 0; i--) {
            const sp = this.tapSparks[i];
            sp.life -= sp.decay * dt;
            if (sp.life <= 0) {
              this.tapSparks.splice(i, 1);
              continue;
            }
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            sp.vy += 80 * dt;
            sp.vx *= 0.96;
            const a = Math.pow(sp.life, 1.25);
            ctx.fillStyle = `rgba(${sp.col[0]},${sp.col[1]},${sp.col[2]},${a.toFixed(2)})`;
            ctx.fillText(sp.glyph, sp.x, sp.y);
            if (sp.flare && a > 0.35) {
              this.drawLensFlare(ctx, sp.x + 4, sp.y + 4, 14 * a, sp.col[0], sp.col[1], sp.col[2], a * 0.7);
            }
          }
        }

        ctx.restore();

        // 10. Telemetry HUD
        const deg = (((this.yaw * 180) / Math.PI) % 360 + 360) % 360;
        this.hud.time.textContent = `t ${t.toFixed(2).padStart(5, "0")}s`;
        this.hud.rot.textContent = `${deg.toFixed(2).padStart(6, "0")}°`;
        this.hud.blooms.textContent = this.bloomCount;
        this.hud.letters.textContent = activeLetters.toLocaleString("en-US");
        this.hud.fps.textContent = `${this.fps} fps`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("ascii-canvas");
      const hud = {
        time: document.getElementById("hud-time"),
        rot: document.getElementById("hud-rot"),
        blooms: document.getElementById("hud-blooms"),
        letters: document.getElementById("hud-letters"),
        fps: document.getElementById("hud-fps")
      };

      const music = new GardenMusicEngine();
      const garden = new RadiantAsciiTulipGarden(canvas, hud, music);
      window.asciiTulipApp = garden;

      const loop = now => {
        garden.render(now);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);

      // Opening Veil Auto-Fade + Instant Dismiss on Click
      const curtain = document.getElementById("intro-curtain");
      const dismissCurtain = () => {
        curtain.classList.add("hide");
        tryAutoMusic();
      };
      curtain.addEventListener("click", dismissCurtain);
      setTimeout(() => curtain.classList.add("hide"), 1900);

      // Music Auto-Start + First-Gesture Unlock
      const btnAudio = document.getElementById("btn-audio");
      const audioLbl = document.getElementById("audio-lbl");
      let userPaused = false;

      const setAudioUI = on => {
        btnAudio.classList.toggle("playing", on);
        audioLbl.textContent = on ? "❚❚ Nhạc" : "▶ Nhạc";
      };

      const tryAutoMusic = async () => {
        if (userPaused || music.playing) return;
        const ok = await music.start();
        setAudioUI(ok);
      };

      tryAutoMusic();
      const unlockEvents = ["pointerdown", "touchstart", "keydown", "click"];
      const onFirstGesture = () => {
        tryAutoMusic();
        if (music.playing) {
          unlockEvents.forEach(ev => window.removeEventListener(ev, onFirstGesture));
        }
      };
      unlockEvents.forEach(ev => window.addEventListener(ev, onFirstGesture, { passive: true }));

      btnAudio.addEventListener("click", async e => {
        e.stopPropagation();
        if (music.playing) {
          userPaused = true;
          music.stop();
          setAudioUI(false);
        } else {
          userPaused = false;
          const ok = await music.start();
          setAudioUI(ok);
        }
      });

      document.getElementById("btn-replay").addEventListener("click", e => {
        e.stopPropagation();
        garden.replay();
      });
    });
  })();
  </script>
</body>
